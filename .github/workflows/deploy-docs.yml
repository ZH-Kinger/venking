name: 部署文档

# 文章源已移出本公开仓库,存放在私有仓库 ZH-Kinger/obisidian。
# CI 流程:拉取私有文章源 → 同步生成 posts(含脱敏)→ 密钥闸门 → 构建 VuePress → 部署到 blog 分支。
#
# 需要在本仓库 Settings → Secrets and variables → Actions 配置:
#   OBSIDIAN_DEPLOY_KEY (必填)私有 obisidian 的 SSH deploy key 私钥的 **base64**(单行;该仓库 Deploy keys 加对应公钥,只读)
#   SECRETS_DENYLIST    (可选)每行一条要额外精确脱敏的字面量,等同本地 scripts/.secrets-denylist
#
# 触发:push 到 main(改样式/配置时)、或手动 workflow_dispatch(改完文章后重建)。
# 说明:文章改动发生在私有 obisidian 仓库,不会自动触发本 CI;改完文章到 Actions 手动跑一次,
#       或后续在 obisidian 仓库加 repository_dispatch 回调本仓库实现自动发布。

on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  # 私有 obisidian 仓库 push 后,经 repository_dispatch 自动触发本 CI(改完笔记就发,免手点)
  repository_dispatch:
    types: [obsidian-updated]

# 新 push 自动取消同分支正在跑的旧运行(免得慢运行堆积)
concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout(本仓库)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blog/package-lock.json

      - name: 拉取私有文章源 + 同步生成 posts(含脱敏)+ 图片双层压缩
        env:
          OBSIDIAN_DEPLOY_KEY: ${{ secrets.OBSIDIAN_DEPLOY_KEY }}
          SECRETS_DENYLIST: ${{ secrets.SECRETS_DENYLIST }}
          OBSIDIAN_VAULT: ${{ github.workspace }}/.cache/obsidian-vault
        run: |
          if [ -z "$OBSIDIAN_DEPLOY_KEY" ]; then
            echo "::error::缺少 secret OBSIDIAN_DEPLOY_KEY(私有 obisidian 的 SSH deploy key 私钥)。在 Settings→Secrets and variables→Actions 添加后重跑。"
            exit 1
          fi
          # 用 deploy key 经 SSH 浅克隆(--depth 1 提速;文章日期由入库的 blog/.posts-dates.json 结转,不依赖历史)
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # secret 存的是私钥的 base64(单行,避免换行/格式被破坏);这里解码还原
          echo "$OBSIDIAN_DEPLOY_KEY" | base64 -d > ~/.ssh/obisidian_key
          chmod 600 ~/.ssh/obisidian_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/obisidian_key -o IdentitiesOnly=yes" \
            git clone --quiet --depth 1 git@github.com:ZH-Kinger/obisidian.git "$OBSIDIAN_VAULT"
          # 可选:把精确 denylist 从 secret 落地,获得与本地一致的精确脱敏
          if [ -n "$SECRETS_DENYLIST" ]; then
            printf '%s\n' "$SECRETS_DENYLIST" > scripts/.secrets-denylist
          fi
          node scripts/sync-obsidian-to-vuepress.mjs
          # 图片双层压缩(CI 是 Linux,用 ImageMagick;本地是 sips)
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null
          node scripts/optimize-images.mjs

      - name: 密钥泄露闸门(检出即阻断部署)
        run: |
          # 高置信度形态(API key)兜底扫描:命中则失败,把带密钥的文章挡在部署前。
          # 本地 publish.mjs 已做脱敏,这里是 CI 侧的最后一道防线。
          if grep -rEn "sk-[A-Za-z0-9]{16,}" blog/src/posts; then
            echo "::error::检测到疑似 API key(sk-…)进入构建内容,已阻断部署。请在源笔记中改为占位,或加入 SECRETS_DENYLIST。"
            exit 1
          fi
          echo "✓ 密钥闸门通过(未检出 sk- 形态密钥)"

      - name: 安装依赖
        working-directory: blog
        run: |
          corepack enable
          npm ci

      - name: 构建文档
        working-directory: blog
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: |
          npm run docs:build
          touch src/.vuepress/dist/.nojekyll

      - name: 顶栏死链闸门(构建后比对产物)
        run: |
          # 2026-07 顶栏有四条死链在线上跑了一段时间没人发现:「AI 助手」被 base 加前缀成
          # /blog/ai/,三个含 ASCII 字母的分类写成大写而 theme-hope 把聚合页 slugify 成小写。
          # 那三个分类合计 312 篇 —— 占全站 59% 从顶栏点进去全是 404,而纯中文分类正常,
          # "看着大部分能点"掩盖了问题。这类配置与产物结构的错配单元测试碰不到,只能构建后比对。
          node scripts/check-navbar-links.mjs

      - name: 部署到 GitHub Pages(blog 分支,备用/冗余镜像)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: blog
          folder: blog/src/.vuepress/dist
          # 部署分支只保留单提交,不累积历史 —— 避免旧构建产物(含历史泄露)残留在 blog 分支。
          single-commit: true

      - name: 部署到生产服务器(rsync 增量 + 原子软链切换,零闪断)
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}   # CI→服务器 SSH 私钥的 base64(单行)
          SERVER_SSH: ${{ secrets.SERVER_SSH }}           # user@host(敏感,放 secret)
        run: |
          if [ -z "$SERVER_SSH_KEY" ] || [ -z "$SERVER_SSH" ]; then
            echo "::warning::未配置 SERVER_SSH_KEY / SERVER_SSH,跳过服务器部署(仅 GitHub Pages)。"; exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SERVER_SSH_KEY" | base64 -d > ~/.ssh/srv_key && chmod 600 ~/.ssh/srv_key
          host="${SERVER_SSH#*@}"; ssh-keyscan -t ed25519,rsa "$host" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/srv_key -o IdentitiesOnly=yes -o ConnectTimeout=20"
          rel="r-${GITHUB_SHA::12}-$(date +%s)"
          # rsync 到新 release 目录:--link-dest 让未变文件从当前版硬链(不传输/不占额外空间),只传改动 → 增量、快
          # 重试 3 次抗跨洋抖动;--partial 断点续传
          for i in 1 2 3; do
            rsync -az --delete --partial --link-dest=/var/www/blog-current \
              -e "$SSH" blog/src/.vuepress/dist/ "$SERVER_SSH:/var/www/blog-releases/$rel/" && break
            echo "rsync 第 $i 次失败,重试…"; sleep 10
          done
          # 服务器端校验 + 原子软链切换(失败绝不碰活站)
          $SSH "$SERVER_SSH" "/root/blog-publish.sh $rel"
