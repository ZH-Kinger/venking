# 静态资源长缓存(server 上下文)。放置:/etc/nginx/default.d/cache.conf(default server block 里 include)。
# 命中的都是内容哈希文件名(_astro/*.hash.js、blog/assets/*.hash.js),内容变则文件名变,故可 immutable 1 年。
# 注:文章图片走 /blog/assets/posts,同样命中此规则(重复访问走浏览器缓存,不再重下)。
location ~* ^/(_astro|blog/assets)/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}
