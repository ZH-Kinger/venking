# 静态资源长缓存(server 上下文)。放置:/etc/nginx/default.d/cache.conf(default server block 里 include)。
# 命中的都是内容哈希文件名(_astro/*.hash.js、blog/assets/*.hash.js),内容变则文件名变,故可 immutable 1 年。
# 注:文章图片走 /blog/assets/posts,同样命中此规则(重复访问走浏览器缓存,不再重下)。
#
# ⚠️ nginx add_header 的继承规则:某一层**只要出现任意一条** add_header,
#    上层(server / http)的 add_header 就**全部不继承**。所以这个 location 里
#    必须把 tls-params.conf 的三条安全头原样重复一遍,否则占全站流量大头的
#    JS/CSS/图片会裸奔(实测过:改之前这里只有 Cache-Control)。
#    以后往这个 location 加头,记得同步 tls-params.conf;反之亦然。
location ~* ^/(_astro|blog/assets)/ {
    # 只用 add_header,不再叠 `expires 1y` —— 两者会各发一条 Cache-Control,重复且易冲突
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # ↓ 与 /etc/nginx/tls-params.conf 保持一致(被 add_header 继承规则打断,必须重复)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
}
