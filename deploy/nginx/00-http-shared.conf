# http 层共享定义(放 /etc/nginx/conf.d/00-http-shared.conf)
#
# 文件名 `00-` 前缀保证在 venking-ssl.conf 之前加载 —— limit_req_zone / map
# 必须先定义后引用。

# WebSocket 升级的标准写法:非 WS 请求不要恒置 Connection: upgrade。
# 恒置会让上游收到「有 Connection: upgrade 但没有 Upgrade 头」的半畸形请求,
# 部分上游判 400,并且会打断 keepalive。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 登录端点限流:防凭证填充/爆破。10m 的共享内存约能跟踪 16 万个 IP。
# rate=10r/s + burst=20 nodelay:正常人点登录远低于此,脚本爆破会被挡住。
# 用它的 location 记得配 `limit_req_status 429` —— nginx 默认 503,会和
# 后端「鉴权服务暂不可用」的 503 撞语义。
#
# ⚠️ 键是 $binary_remote_addr = 直连对端 IP。现在 nginx 直面公网所以是真实客户端;
#    日后若套 CDN/负载均衡,所有流量会共用一个桶,rate=10r/s 会瞬间误伤全站 ——
#    那时必须先配 set_real_ip_from + real_ip_header 拿回真实 IP。
limit_req_zone $binary_remote_addr zone=authlimit:10m rate=10r/s;

# 不记 query string 的日志格式,并把它设为**全局默认**。
#
# 起因是 SSE:`/api/chat?access_token=<JWT>`(浏览器 EventSource 设不了 Authorization 头),
# 完整 JWT 会明文长留 access.log 并进 logrotate 备份 —— 读得到日志=拿到有效 bearer。
# 但最初只给 /api/ 单独配了这个格式,结果漏了三处同样带凭据的路径(线上实测抓到):
#     /admin/callback?code=…            我方 OAuth 授权码
#     /ai/?code=…                       同上
#     /callback/<connectorId>?code=…    GitHub/QQ 回给 Logto 的授权码
# 逐个 location 去补是防不住的 —— 新增任何接收回调的路径都会再漏一次。
# 所以在 http 层直接把默认格式换掉:此后任何 server/location 不做任何事就是安全的,
# 需要看 query 时再针对性地临时开 combined,而不是反过来。
#
# 代价:排障时看不到 query。真需要时用 `access_log … combined;` 临时覆盖单个 location,
# 但**永远别对接收凭据的路径这么做**。
#
# ⚠️ 这里只定义格式,**不**在 http 层写 access_log —— stock nginx.conf 的 http 层已经有
#    一条 `access_log … main`,再加一条不是覆盖而是**并存**,同一请求会写两行,
#    带 query 的那行照样泄露(踩过)。access_log 的继承规则是"下层声明替换上层整组",
#    所以正确做法是在**每个 server 块**里显式声明,见 venking-ssl.conf。
log_format noargs '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
