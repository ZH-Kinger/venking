# 未知 Host 兜底(放 /etc/nginx/conf.d/00-default-catchall.conf)
#
# 为什么必须有:CentOS 的 nginx.conf 里 `include /etc/nginx/conf.d/*.conf` 排在
# stock server 之前,而 stock server 没写 default_server。于是 conf.d 里第一个
# listen 80 的 server 会被 nginx 当成隐式 default_server —— 裸 IP / 别人把未备案
# 域名解析到本机时,都会落到 venking 的 301 上,跳去证书名对不上的 https。
# 这里用文件名 `00-` 排最前 + 显式 default_server 把兜底权拿回来。
# 配套改动:nginx.conf 里 stock server 的 `server_name _` 已改成 __stock_unused__,
# 否则 :80 上两个 `_` 会刷 "conflicting server name" 警告,掩盖真正的告警。
#
# 备案合规角度也需要:别人把未备案域名 A 记录指到你的 IP,流量落到你站上会连累
# 你的备案。直接 444(不响应、断连)是最省事的隔离。
#
# 调试时想用 IP 访问:curl --resolve venking.tech:443:<IP> https://venking.tech/

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen      443 ssl http2 default_server;
    listen      [::]:443 ssl http2 default_server;
    server_name _;

    # nginx 1.19.4+:直接拒绝 TLS 握手,连证书都不出示(也就不会有名字不匹配的告警)
    ssl_reject_handshake on;
}
