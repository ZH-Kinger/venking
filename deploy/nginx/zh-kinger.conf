# Loaded inside the default nginx server block via /etc/nginx/default.d/*.conf.
location / {
    # 曾是 `try_files $uri $uri/ /index.html` —— 把任何不存在的路径兜成主页(soft-404):
    # 返回 200 + 主页而不是 404。危害:①点到失效博客链接会静默变主页,人分不清是链接坏了
    # ②sitemap 上线后搜索引擎把垃圾路径当有效页收录 ③扫描器探 /.env、/adminer.php 都得 200,
    # 以为路径存在而引来更多探测(实测过,当时每次白送 16.9KB 主页)。
    # 现在:找不到就 404,交给 homepage 构建出的 /404.html 渲染。
    # 注意主站是**静态站**(Astro 只有 / 一个页面 + blog 的真实 .html 文件),
    # 不需要 SPA 回退;真正需要回退的 /admin/ 由 rag-server 自己处理。
    try_files $uri $uri/ =404;
}
# 不要在这里写 error_page 404 / location = /404.html —— stock nginx.conf 的 server 块里
# 已经有了(见 /etc/nginx/nginx.conf),重复声明会 `duplicate location "/404.html"` 直接拒启。
# 本文件是被 include 进那个 server 的,与它同级。

location = /ai {
    return 301 /ai/;
}

location /ai/ {
    proxy_pass http://127.0.0.1:7860/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}

location = /admin {
    return 301 /admin/;
}

# 管理后台(admin-web SPA)。产物由 rag-server 同源提供(api.py 挂载 static/admin,
# 并把 /admin/* 深链回退到 index.html),所以这里整段反代过去即可,
# 不用在 nginx 再写一遍 try_files。
location /admin/ {
    # 后台是高价值目标,限流从严:登录爆破、审计日志遍历都从这儿进
    limit_req zone=authlimit burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:7860/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 附件上传:唯一需要大 body 的端点,所以**只给它**放宽,不动 /api/ 整体。
# nginx 默认 client_max_body_size 1m —— 应用层写着 5MB 上限,却被 nginx 挡在门外,
# 手机随手一拍就是 3~5MB:用户看到的是 413,而且是 nginx 的英文默认页,
# 不是应用那句"单个文件不能超过 5MB"。6m 给 multipart 分隔符留余量。
# 为什么不写在 `location /api/`:那样 /api/feedback 也跟着变 6m,
# 而它把请求体直接追加进 feedback.jsonl —— 限流 10r/s 下就是 60MB/s 写盘,盘只有 27G。
#
# ⚠️ 这里的 limit_req / proxy_set_header 必须与下面 `location /api/` 保持一致(精确匹配优先级
# 更高,漏一行就是那一行在上传路径上失效)。以下三处是**有意**不同,不是漏配,别照抄过来:
#   · 没有 `proxy_buffering off` —— 那是为 SSE 长流准备的,这里的响应是一小段 JSON;
#   · 没有 `proxy_cache off`     —— 全局没配 proxy_cache_path,且缓存只作用于 GET/HEAD,本块只收 POST;
#   · read_timeout 120s 而非 3600s —— 3600s 是给 SSE 长连接的;body 已被 nginx 缓冲完,
#     这里只等 uvicorn 回一个 JSON,给 120s 已经很宽。
location = /api/me/attachments {
    client_max_body_size 6m;

    limit_req zone=authlimit burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:7860/api/me/attachments;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 响应是小 JSON,不像 SSE 需要关缓冲。
    # 请求体走 nginx 默认的 proxy_request_buffering on:整体收完再转给应用 ——
    # 慢速上传的连接占用落在 nginx 上,而不是只有单 worker 的 uvicorn。
    proxy_read_timeout 120s;
}

# The Agent frontend currently uses root-relative API and vendor URLs.
location /api/ {
    # 显式写死 1m(= nginx 默认),避免将来有人在 http/server 层调大而把
    # /api/feedback 一起放开;上传的例外见上面那个精确匹配 location。
    client_max_body_size 1m;

    # 注:不记 query 已在 http 层设为**全局默认**(见 conf.d/00-http-shared.conf),
    # 这里不再单独声明 —— 曾经只在本 location 配,结果漏了 /admin/callback、/ai/、
    # /callback/<connectorId> 三处同样带 OAuth 授权码的路径。

    # 限流(zone 同样在 00-http-shared.conf)。不只是防刷 ——
    # pyjwt 在 kid 未命中时会强制 refresh 绕过 300s 缓存重取 JWKS,
    # 于是「带随机 kid 的伪造令牌」会 1:1 放大成对 Logto 的出站请求;
    # /api/me/* 又没有应用层 guard(只有 /api/chat 有),不挡就能把我方 IP
    # 刷到被 Logto 限流,最终全站鉴权 503。
    limit_req zone=authlimit burst=20 nodelay;
    # 必须显式指定 429:nginx 默认用 503,会和后端「鉴权服务暂不可用」的 503 撞语义 ——
    # 拿着坏令牌的用户被限流时本该收 401 去重登,收到 503 则被前端判成服务故障、
    # 不重登、卡死。429(Too Many Requests)语义准确,前端可单独做退避重试。
    limit_req_status 429;

    proxy_pass http://127.0.0.1:7860/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}

# /vendor/ 下混着两类文件,缓存策略必须分开:
#   auth.js —— 3KB 的业务逻辑(登录回调地址等),改了必须立刻生效。
#     它没有内容哈希文件名,浏览器又对 ES module 缓存得很凶:2026-07 改了 signIn 的
#     回调地址后,浏览器仍跑旧模块、拿被拒的 redirect_uri 去登录,报 invalid_redirect_uri,
#     而服务端一切正常 —— 这种"只有真人点才暴露、且看着像服务端问题"的坑要从源头堵。
#   其余(mermaid 3.5MB、prism 等)—— 第三方库,版本固定,值得长缓存。
location = /vendor/auth.js {
    proxy_pass http://127.0.0.1:7860/vendor/auth.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # no-cache ≠ 不缓存:仍存本地,但每次都回源用 ETag 校验(命中则 304,只花一个往返)
    add_header Cache-Control "no-cache" always;
}

location /vendor/ {
    proxy_pass http://127.0.0.1:7860/vendor/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 只用 add_header,不叠 `expires` —— 两者会各发一条 Cache-Control(重复且易冲突)
    add_header Cache-Control "public, max-age=2592000" always;
}
