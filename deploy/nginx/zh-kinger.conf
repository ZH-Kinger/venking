# Loaded inside the default nginx server block via /etc/nginx/default.d/*.conf.
location / {
    try_files $uri $uri/ /index.html;
}

location = /ai {
    return 301 /ai/;
}

location /ai/ {
    proxy_pass http://127.0.0.1:7860/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}

# The Agent frontend currently uses root-relative API and vendor URLs.
location /api/ {
    # 不记 query —— /api/chat 的 SSE 用 ?access_token= 传 JWT(EventSource 设不了
    # Authorization 头),默认 combined 格式会把完整令牌写进 access.log 长期留存。
    # log_format noargs 定义在 conf.d/00-http-shared.conf。
    access_log /var/log/nginx/access.log noargs;

    # 限流(zone 同样在 00-http-shared.conf)。不只是防刷 ——
    # pyjwt 在 kid 未命中时会强制 refresh 绕过 300s 缓存重取 JWKS,
    # 于是「带随机 kid 的伪造令牌」会 1:1 放大成对 Logto 的出站请求;
    # /api/me/* 又没有应用层 guard(只有 /api/chat 有),不挡就能把我方 IP
    # 刷到被 Logto 限流,最终全站鉴权 503。
    limit_req zone=authlimit burst=20 nodelay;
    # 必须显式指定 429:nginx 默认用 503,会和后端「鉴权服务暂不可用」的 503 撞语义 ——
    # 拿着坏令牌的用户被限流时本该收 401 去重登,收到 503 则被前端判成服务故障、
    # 不重登、卡死。429(Too Many Requests)语义准确,前端可单独做退避重试。
    limit_req_status 429;

    proxy_pass http://127.0.0.1:7860/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}

location /vendor/ {
    proxy_pass http://127.0.0.1:7860/vendor/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
