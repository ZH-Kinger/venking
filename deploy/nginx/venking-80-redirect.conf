# 80 → HTTPS 强制跳转(放 /etc/nginx/conf.d/venking-80-redirect.conf)
#
# 单独成文件,是为了能独立回滚:确认 https 全绿后再装;
# 万一证书/TLS 出问题,`rm` 掉本文件 + reload 就退回可用的纯 http。
#
# 注意:必须在 venking-ssl.conf 之后才有意义(否则跳过去没人接)。

server {
    listen      80;
    listen      [::]:80;
    server_name venking.tech www.venking.tech auth.venking.tech;

    # 不记 query:覆盖 stock nginx.conf 在 http 层的 `access_log … main`。
    # 本站多处 URL 带凭据 —— /admin/callback?code=、/ai/?code=、
    # /callback/<connectorId>?code=、/api/chat?access_token= ——
    # 用 combined 会把它们明文长留日志并进 logrotate 备份。格式见 00-http-shared.conf。
    access_log /var/log/nginx/access.log noargs;

    # certbot --webroot 续期通道,必须优先于 301 匹配,否则续期会被跳走
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
