# 共用 TLS 参数(放 /etc/nginx/tls-params.conf,被各 443 server include)
# 只留 TLS 1.2/1.3;1.0/1.1 已被主流浏览器判为不安全。

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
# 只留 ECDHE 套件:DHE-RSA-* 是空转 —— 没配 ssl_dhparam,nginx 1.11+ 不再内置 DH 参数,
# 实际永远协商不到,留着只会误导人以为有 DHE 回退路径。
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;

# OCSP stapling 已关闭:Let's Encrypt 自 2025 年起不再在证书中签发 OCSP responder URL,
# 开着只会让 nginx -t 每次刷 "ssl_stapling ignored" 警告。换 CA 时可再开。

# HSTS:先不加 preload —— preload 是**真的不可逆**(要从浏览器内置名单里移除需数月)。
#
# ⚠️ includeSubDomains 的代价:一年内所有访问过 venking.tech 的浏览器都会强制
#    *.venking.tech 走 https。今后新增子域,必须**先**拿到证书(加进 certbot 的 -d
#    列表)并同步 venking-80-redirect.conf 的 server_name,否则该子域完全打不开。
#
# ⚠️ HSTS 也让证书续期从「降级可用」变成「硬故障」:过期后浏览器不给"继续访问"入口。
#    所以 certbot-renew.timer 必须是 enabled 状态,且 deploy hook 会 reload nginx。
#
# ⚠️ 这三条头一旦在某个 location 里出现任意 add_header 就不再继承 —— 见 cache.conf。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
