# gzip 压缩(http 上下文)。放置:/etc/nginx/conf.d/perf.conf(nginx.conf 的 http{} 里 include)。
# HTML/CSS/JS/JSON/SVG 文本类压缩 ~5×(如博客文章列表 135KB→26KB)。图片/字体已压缩,不再 gzip。
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml font/ttf font/otf application/wasm;
