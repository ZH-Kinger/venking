# venking.tech 域名 + HTTPS 收口(放 /etc/nginx/conf.d/venking-ssl.conf)
#
# 前置:
#   1. DNS: venking.tech / www / auth 三条 A 记录 → 服务器公网 IP
#   2. 安全组放行 443
#   3. certbot certonly --webroot -w /var/www/acme \
#        -d venking.tech -d www.venking.tech -d auth.venking.tech
#
# 相关文件(同目录,一起部署):
#   00-http-shared.conf      map $connection_upgrade + 登录限流 zone(必须先加载)
#   00-default-catchall.conf 裸 IP / 未知 Host → 444,并显式抢占 default_server
#   venking-80-redirect.conf 80 → https 301(单独成文件,可独立回滚)
#   tls-params.conf          共用 TLS 参数 + 安全头(/etc/nginx/tls-params.conf)

# ── 443:主站(homepage / + blog /blog/ + RAG /ai/)────────────────
server {
    listen      443 ssl http2;          # nginx 1.20 语法;1.25+ 可改成 listen 443 ssl; + http2 on;
    listen      [::]:443 ssl http2;
    server_name venking.tech;
    root        /usr/share/nginx/html;

    ssl_certificate     /etc/letsencrypt/live/venking.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/venking.tech/privkey.pem;
    include             /etc/nginx/tls-params.conf;

    # 不记 query:覆盖 stock nginx.conf 在 http 层的 `access_log … main`。
    # 本站多处 URL 带凭据 —— /admin/callback?code=、/ai/?code=、
    # /callback/<connectorId>?code=、/api/chat?access_token= ——
    # 用 combined 会把它们明文长留日志并进 logrotate 备份。格式见 00-http-shared.conf。
    access_log /var/log/nginx/access.log noargs;

    # 复用已有的静态站路由(/ 、/blog/ 、/ai/ 反代)与长缓存规则
    include /etc/nginx/default.d/*.conf;

    error_page 404 /404.html;
}

# www → 裸域(规范化,避免两份 URL 分权重 / cookie 作用域混乱)
server {
    listen      443 ssl http2;          # nginx 1.20 语法;1.25+ 可改成 listen 443 ssl; + http2 on;
    listen      [::]:443 ssl http2;
    server_name www.venking.tech;

    ssl_certificate     /etc/letsencrypt/live/venking.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/venking.tech/privkey.pem;
    include             /etc/nginx/tls-params.conf;

    # 不记 query:覆盖 stock nginx.conf 在 http 层的 `access_log … main`。
    # 本站多处 URL 带凭据 —— /admin/callback?code=、/ai/?code=、
    # /callback/<connectorId>?code=、/api/chat?access_token= ——
    # 用 combined 会把它们明文长留日志并进 logrotate 备份。格式见 00-http-shared.conf。
    access_log /var/log/nginx/access.log noargs;

    return 301 https://venking.tech$request_uri;
}

# ── 443:Logto 统一身份(独立子域,Logto 要求自己的 origin)─────────
server {
    listen      443 ssl http2;          # nginx 1.20 语法;1.25+ 可改成 listen 443 ssl; + http2 on;
    listen      [::]:443 ssl http2;
    server_name auth.venking.tech;

    ssl_certificate     /etc/letsencrypt/live/venking.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/venking.tech/privkey.pem;
    include             /etc/nginx/tls-params.conf;

    # 不记 query:覆盖 stock nginx.conf 在 http 层的 `access_log … main`。
    # 本站多处 URL 带凭据 —— /admin/callback?code=、/ai/?code=、
    # /callback/<connectorId>?code=、/api/chat?access_token= ——
    # 用 combined 会把它们明文长留日志并进 logrotate 备份。格式见 00-http-shared.conf。
    access_log /var/log/nginx/access.log noargs;

    # Logto 上传应用 logo 会超过 nginx 默认的 1m,给到 4m
    client_max_body_size 4m;

    # OIDC 响应里带 authorization code / CSRF token,压缩会引入 BREACH 的理论攻击面;
    # 登录流量很小,关掉 gzip 没有性能代价(http 层 perf.conf 开的 gzip 在此覆盖)
    gzip off;

    # 不加 X-Frame-Options:Logto 自己发 `frame-ancestors 'self' http://localhost:3002`,
    # 比一刀切 DENY 更准确;硬加 DENY 会掐掉管理台自身的 iframe。

    # Logto 靠 X-Forwarded-* 生成 OIDC 里的绝对 URL,漏了会签发 http:// 的 issuer。
    # $host 由 nginx 覆写,外部无法伪造 X-Forwarded-Host。
    location / {
        # 登录/授权端点限流,挡凭证填充(zone 定义在 00-http-shared.conf)
        limit_req          zone=authlimit burst=20 nodelay;
        # 默认的 503 会被当成"服务故障";429 才是"你太快了",语义准确且可退避重试
        limit_req_status   429;

        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        # 非 WebSocket 请求发 close,不恒置 upgrade(map 在 00-http-shared.conf)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
