<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Kinger logo">
  <defs>
    <linearGradient id="kg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e6ad2"/>
      <stop offset="1" stop-color="#f5455c"/>
    </linearGradient>
  </defs>
  <!-- 连线(拓扑):先画线,让节点盖住端点 -->
  <g stroke="url(#kg)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
    <line x1="16" y1="20" x2="16" y2="44"/>
    <line x1="16" y1="20" x2="46" y2="16"/>
    <line x1="16" y1="44" x2="46" y2="48"/>
    <line x1="46" y1="16" x2="46" y2="48"/>
    <line x1="16" y1="20" x2="46" y2="48"/>
  </g>
  <!-- 节点 -->
  <g fill="url(#kg)">
    <circle cx="16" cy="20" r="6"/>
    <circle cx="16" cy="44" r="6"/>
    <circle cx="46" cy="16" r="5.5"/>
    <circle cx="46" cy="48" r="5.5"/>
  </g>
</svg>
