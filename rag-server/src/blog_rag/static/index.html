<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08090a">
<link rel="icon" type="image/png" href="/vendor/feather-indigo.png?v=6">
<title>Kinger · 博客助手</title>
<style>
  :root{
    /* 与博客共用一套品牌色、表面层级与圆角语言 */
    --ink:#f2f3f5; --sub:#969ba6; --muted:#626773; --line:rgba(255,255,255,.075); --bg:#090a0d;
    --side:#0c0e12; --user-bg:#1a1d24; --chip:#11141a; --hover:#181b22; --code-bg:#0d1117;
    --elev:#14171d; --elev-strong:#191c23; --line-strong:rgba(255,255,255,.15); --accent:#6975dc;
    --accent-hover:#7782e7; --accent-soft:rgba(105,117,220,.14); --accent-ink:#b9c0ff;
    --success:#63c98c; --danger:#ef7180;
    --shadow:0 22px 70px rgba(0,0,0,.36); --radius-card:16px; --radius-control:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#08090a}
  body{font-family:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:
      radial-gradient(circle at 73% -18%,rgba(105,117,220,.105),transparent 34rem),
      var(--bg);-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
  button,textarea{font:inherit}
  /* 深色滚动条(默认白滚动条在深色页很突兀) */
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
  *::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2);background-clip:padding-box}
  *::-webkit-scrollbar-track{background:transparent}
  html{color-scheme:dark}
  .layout{display:flex;min-height:100dvh;height:100dvh;overflow:hidden}

  /* 侧边栏 */
  .sidebar{width:280px;flex:0 0 280px;background:rgba(12,14,18,.94);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:16px 14px;transition:margin-left .22s;
    backdrop-filter:blur(24px);
    animation:sideIn .5s cubic-bezier(.16,1,.3,1) both}
  .sidebar.collapsed{margin-left:-280px}
  .side-head{display:flex;align-items:center;gap:11px;padding:5px 7px 18px}
  .brand-copy{min-width:0}
  .logo{display:block;font-size:15px;font-weight:650;letter-spacing:-.015em;color:var(--ink)}
  .brand-sub{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.035em;margin-top:2px}
  .brand-dot{width:30px;height:30px;flex:0 0 auto;display:block;color:var(--accent);
    padding:5px;border-radius:9px;background:var(--accent-soft);border:1px solid rgba(105,117,220,.24)}
  .brand-dot line,.brand-dot circle{transform-origin:center}
  .newchat{width:100%;display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--elev);
    border-radius:var(--radius-control);padding:11px 13px;font-size:13.5px;color:var(--ink);cursor:pointer;
    transition:background .18s,border-color .18s,transform .12s;font-weight:560}
  .newchat:hover{background:var(--elev-strong);border-color:var(--line-strong)}
  .newchat:active{transform:scale(.985)}
  .newchat .shortcut{margin-left:auto;color:var(--muted);font-size:11px}
  .side-label{font-size:10.5px;color:var(--muted);padding:19px 9px 8px;letter-spacing:.08em;text-transform:uppercase}
  .side-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
  .item{min-height:38px;padding:0 7px 0 12px;border-radius:10px;font-size:13.5px;color:#c8cbd1;
    display:flex;align-items:center;gap:5px;transition:.12s;position:relative}
  .item:hover{background:var(--hover)}
  .item.active{background:var(--accent-soft);color:var(--accent-ink)}
  .item-main{min-width:0;flex:1;border:0;background:transparent;color:inherit;text-align:left;padding:9px 0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .item-actions{display:flex;align-items:center;opacity:0;transition:opacity .12s}
  .item:hover .item-actions,.item.active .item-actions{opacity:.75}
  .item-action{width:27px;height:27px;border:0;background:transparent;color:var(--sub);border-radius:7px;
    display:grid;place-items:center;padding:0;cursor:pointer}
  .item-action:hover{opacity:1;background:rgba(255,255,255,.08);color:var(--ink)}
  .item-action.armed{color:var(--danger);background:rgba(239,113,128,.1)}
  .item-action svg{width:14px;height:14px}
  .rename-input{min-width:0;flex:1;height:30px;border:1px solid rgba(105,117,220,.4);border-radius:8px;
    padding:0 8px;background:var(--elev);color:var(--ink);outline:none}
  .side-foot{display:grid;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
  .side-tool{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--sub);
    border-radius:9px;padding:9px 10px;font-size:12.5px;cursor:pointer;text-align:left}
  .side-tool:hover{background:var(--hover);color:var(--ink)}
  .side-tool svg{width:16px;height:16px}

  /* 主区 */
  .app{flex:1;display:flex;flex-direction:column;min-width:0;max-width:100%}
  .topbar{display:flex;align-items:center;gap:10px;min-height:58px;padding:9px 18px;flex:0 0 auto;
    border-bottom:1px solid var(--line);background:rgba(8,9,10,.72);backdrop-filter:blur(18px);
    animation:topIn .45s .08s cubic-bezier(.16,1,.3,1) both}
  .hamb{border:none;background:transparent;font-size:20px;cursor:pointer;color:var(--sub);
    width:36px;height:36px;display:grid;place-items:center;padding:0;border-radius:10px;line-height:1}
  .hamb:hover{background:var(--hover)}
  .topbar .title{font-size:13.5px;color:#c8cbd1;font-weight:550}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
  .top-link{display:inline-flex;align-items:center;height:34px;padding:0 10px;border-radius:9px;
    color:var(--sub);font-size:12.5px;text-decoration:none;transition:background .15s,color .15s}
  .top-link:hover{background:var(--hover);color:var(--ink)}
  button.top-link{border:1px solid var(--line);background:var(--elev);cursor:pointer;font:inherit;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top-link[hidden]{display:none!important}   /* hidden 属性要压过 .top-link 的 display:inline-flex,否则未登录时露空按钮 */
  #cloudBox{display:none;flex-direction:column}
  #cloudBox.show{display:flex}
  .cloud-hint{font-size:11px;color:var(--muted);padding:2px 9px 8px}
  /* 服务状态:只保留一个小圆点(无边框无文字),状态用颜色 + hover 提示表达 */
  .health{display:inline-flex;align-items:center;height:34px;padding:0 6px;margin-left:2px;cursor:default}
  .health-dot{width:9px;height:9px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 4px rgba(255,255,255,.04);transition:background .2s ease}
  .health.ok .health-dot{background:var(--success);box-shadow:0 0 0 4px rgba(99,201,140,.14)}
  .health.fail .health-dot{background:var(--danger);box-shadow:0 0 0 4px rgba(239,113,128,.14)}
  main{flex:1 1 auto;min-width:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
  .wrap{width:100%;max-width:820px;margin:0 auto;padding:12px 24px 48px}

  #welcome{padding:clamp(54px,9vh,100px) 4px 0}
  .welcome-mark{display:flex;align-items:center;gap:9px;color:var(--accent-ink);font-size:12px;
    font-family:"SFMono-Regular",Consolas,monospace;margin-bottom:18px}
  .welcome-mark svg{width:17px;height:17px}
  #welcome h1{max-width:690px;font-size:clamp(34px,5vw,48px);line-height:1.06;letter-spacing:-.045em;margin:0 0 16px;
    font-weight:620;color:var(--ink);text-wrap:balance}
  #welcome p{max-width:590px;color:var(--sub);font-size:15.5px;line-height:1.7;margin:0 0 32px}
  .chips{width:100%;display:grid;grid-template-columns:1.12fr .88fr;gap:10px;max-width:690px}
  .chip{min-width:0;text-align:left;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.015));
    border-radius:var(--radius-card);padding:16px 17px;font-size:13.5px;color:#d9dbe0;cursor:pointer;
    transition:background .18s,border-color .18s,transform .18s,box-shadow .18s;line-height:1.45}
  .chip:nth-child(2),.chip:nth-child(3){background:var(--chip)}
  .chip-k{display:block;font-size:10px;color:var(--muted);letter-spacing:.075em;text-transform:uppercase;margin-bottom:7px}
  .chip:hover{border-color:rgba(94,106,210,.55);background:var(--accent-soft);
    box-shadow:0 12px 32px rgba(0,0,0,.2);transform:translateY(-2px)}
  .chip:active{transform:translateY(0) scale(.99)}

  .msg{margin:22px 0;display:flex;flex-direction:column}
  .msg.user{align-items:flex-end}
  .msg.user .bubble{background:var(--user-bg);padding:12px 16px;border-radius:18px 18px 4px 18px;
    max-width:88%;border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
  .msg.bot .role{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-bottom:8px}
  .msg.bot .avatar{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;
    color:var(--accent-ink);background:var(--accent-soft);border:1px solid rgba(105,117,220,.25);flex:0 0 auto}
  .msg.bot .avatar svg{width:14px;height:14px}
  .content{font-size:15.5px;line-height:1.75;word-break:break-word}
  .content p{margin:.5em 0}
  .content h2,.content h3{margin:.8em 0 .4em;line-height:1.3}
  .content ul,.content ol{margin:.4em 0;padding-left:1.4em}
  .content li{margin:.25em 0}
  .content code.inline{background:rgba(255,255,255,.08);padding:.12em .4em;border-radius:6px;font-size:.9em;
    color:#e6a5ad;font-family:"SF Mono",Consolas,Monaco,monospace}
  .content a{color:#8b95e8;text-decoration:none}.content a:hover{text-decoration:underline}
  .codeblock{position:relative;margin:14px 0;border-radius:12px;overflow:hidden;background:var(--code-bg)}
  .codeblock .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;
    background:#161b22;color:#8b949e;font-size:12px}
  .codeblock .copy{background:transparent;border:1px solid #30363d;color:#c9d1d9;border-radius:6px;
    padding:3px 10px;cursor:pointer;font-size:12px}.codeblock .copy:hover{background:#30363d}
  .codeblock pre{margin:0;padding:14px 16px;overflow-x:auto}
  .codeblock code{color:#e6edf3;font-family:"SF Mono",Consolas,Monaco,monospace;font-size:13.5px;line-height:1.6}
  /* Prism 自托管语法色，收敛到当前深色品牌色 */
  .token.comment,.token.prolog,.token.doctype,.token.cdata{color:#727985}
  .token.punctuation{color:#a8adb7}.token.namespace{opacity:.8}
  .token.property,.token.tag,.token.boolean,.token.number,.token.constant,.token.symbol,.token.deleted{color:#ef8995}
  .token.selector,.token.attr-name,.token.string,.token.char,.token.builtin,.token.inserted{color:#82c995}
  .token.operator,.token.entity,.token.url,.language-css .token.string,.style .token.string{color:#c0a8f3}
  .token.atrule,.token.attr-value,.token.keyword{color:#8fa0f2}
  .token.function,.token.class-name{color:#e4c07a}
  .token.regex,.token.important,.token.variable{color:#e59b72}
  .badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:20px;margin-bottom:6px}
  .b-grounded{background:rgba(52,168,83,.18);color:#5fd486}.b-web{background:rgba(94,106,210,.2);color:#a9b1ec}
  .b-general{background:rgba(245,158,11,.16);color:#f0b429}.b-refuse{background:rgba(245,69,92,.16);color:#f5808e}
  .sources{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.018);
    font-size:13px;color:var(--sub);overflow:hidden}
  .sources summary{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#c9ccd3;font-weight:550;
    cursor:pointer;list-style:none;user-select:none;transition:background .15s}
  .sources summary:hover{background:rgba(255,255,255,.025)}
  .sources summary::-webkit-details-marker{display:none}
  .sources summary svg{width:16px;height:16px;color:var(--accent-ink)}
  .sources summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
  .sources[open] summary .chev{transform:rotate(180deg)}
  .sources-body{padding:0 13px 11px;border-top:1px solid var(--line)}
  .sources .t{font-weight:600;margin:10px 0 6px;color:var(--ink)}.sources li{margin:5px 0}
  /* 正文内联引用角标 [S1] 可点 */
  a.cite{color:var(--accent-ink);text-decoration:none;font-weight:600;padding:0 2px;border-radius:4px;transition:background .15s}
  a.cite:hover{background:var(--accent-soft)}
  /* 操作行:复制/反馈，统一为 Tabler 风格线性图标按钮 */
  .actrow{display:flex;align-items:center;gap:2px;margin-top:12px}
  .actbtn{display:grid;place-items:center;width:34px;height:34px;border:none;background:transparent;
    color:var(--sub);border-radius:50%;cursor:pointer;transition:background .12s,color .12s,transform .1s;padding:0}
  .actbtn:hover{background:var(--hover);color:var(--ink)}
  .actbtn:active{transform:scale(.9)}
  .actbtn.on{color:#8b95e8}
  .actbtn svg{width:19px;height:19px;display:block}
  .acttip{font-size:12px;color:var(--sub);margin-left:6px}
  /* 各处内联图标统一尺寸 */
  .newchat svg{width:18px;height:18px;display:block}
  .hamb svg,#send svg{width:20px;height:20px;display:block}
  .item .del svg{width:13px;height:13px;display:block}
  .codeblock .copy{display:inline-flex;align-items:center;gap:5px}
  .codeblock .copy svg{width:14px;height:14px}
  .fbform{margin-top:10px}
  .fbta{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;
    font:inherit;font-size:14px;resize:vertical;outline:none;background:var(--elev);color:var(--ink)}
  .fbta:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(94,106,210,.2)}
  .fbrow{display:flex;gap:8px;margin-top:8px}
  .fbsend{border:none;background:var(--accent);color:#fff;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:500}
  .fbsend:hover{filter:brightness(1.06)}
  .fbcancel{border:1px solid var(--line);background:var(--elev);color:var(--sub);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px}
  .fbcancel:hover{background:var(--hover)}
  .mermaid-wrap{margin:14px 0;text-align:center;overflow-x:auto}
  .mermaid-wrap svg{max-width:100%;height:auto}
  .mermaid-loading{margin:14px 0;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;
    color:var(--sub);font-size:13px}
  .cursor{display:inline-block;width:8px;height:16px;background:var(--accent);border-radius:2px;
    vertical-align:text-bottom;animation:blink 1s steps(2) infinite}
  @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  .thinking{display:inline-flex;align-items:center;gap:10px;min-height:30px;color:var(--sub);font-size:13px}
  .thinking-icon{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;
    color:var(--accent-ink);background:var(--accent-soft);border:1px solid rgba(105,117,220,.2)}
  .thinking-icon svg{width:14px;height:14px}
  .thinking-dots{display:inline-flex;align-items:center;gap:4px}
  .thinking-dots i{width:4px;height:4px;border-radius:50%;background:var(--accent-ink);opacity:.3}
  .error-card{margin:8px 0;padding:13px 14px;border:1px solid rgba(239,113,128,.2);border-radius:12px;
    background:rgba(239,113,128,.055);color:#d7a0a8;font-size:13.5px;line-height:1.55}
  .error-card strong{display:block;color:#f0b2bb;margin-bottom:2px}
  .error-retry{display:inline-flex;align-items:center;gap:6px;margin-top:9px;border:1px solid rgba(239,113,128,.25);
    border-radius:8px;background:rgba(239,113,128,.08);color:#f0b2bb;padding:6px 10px;font-size:12px;cursor:pointer}
  .error-retry:hover{background:rgba(239,113,128,.14)}
  .error-retry svg{width:14px;height:14px}

  footer{flex:0 0 auto;min-width:0;padding:10px 20px 17px;background:linear-gradient(180deg,transparent,var(--bg) 34%);
    animation:composerIn .55s .16s cubic-bezier(.16,1,.3,1) both}
  .composer{width:100%;max-width:820px;margin:0 auto}
  .toggles{display:flex;gap:8px;margin:0 4px 10px}
  .toggle{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);border:1px solid var(--line);
    border-radius:10px;padding:6px 10px;cursor:pointer;user-select:none;transition:.15s;background:rgba(20,23,29,.82)}
  .toggle svg{width:15px;height:15px;flex:0 0 auto}
  .toggle:hover{border-color:var(--line-strong);color:var(--ink)}
  .toggle.on{background:rgba(94,106,210,.2);color:#a9b1ec;border-color:rgba(94,106,210,.4)}
  .inputbar{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line-strong);border-radius:20px;
    padding:8px 8px 8px 18px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.045);
    transition:border-color .15s,box-shadow .15s;background:rgba(20,23,29,.96);backdrop-filter:blur(20px)}
  .inputbar:focus-within{border-color:rgba(105,117,220,.48);box-shadow:var(--shadow),0 0 0 3px rgba(105,117,220,.12)}
  #q{flex:1;border:none;outline:none;resize:none;font:inherit;font-size:15.5px;line-height:1.5;
    min-width:0;max-height:180px;padding:8px 0;background:transparent;color:var(--ink)}
  #send{flex:0 0 auto;width:40px;height:40px;border:none;border-radius:50%;cursor:pointer;
    background:var(--accent);color:#fff;font-size:18px;display:grid;place-items:center;transition:.15s}
  #send.stop{background:#c5221f}
  /* 回形针进了输入框左侧,原本 18px 的左内边距要收掉,否则按钮离边太远 */
  .inputbar:has(.attach-btn){padding-left:8px}
  .attach-btn{flex:0 0 auto;width:36px;height:36px;margin-bottom:2px;border:none;border-radius:50%;
    cursor:pointer;background:transparent;color:var(--sub);display:grid;place-items:center;transition:.15s}
  .attach-btn svg{width:20px;height:20px}
  .attach-btn:hover{background:rgba(255,255,255,.07);color:var(--ink)}
  .attach-btn:active{transform:scale(.92);transition:transform 80ms ease-out}
  .attach-btn[disabled]{opacity:.4;cursor:not-allowed}
  /* 缩略图条:横向可滚,不因图多而把输入框顶变形 */
  .attachbar{padding:0 4px 10px}
  .attachbar .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin}
  .attach-note{font-size:12px;color:var(--sub);padding:0 2px 6px}
  .attachbar[hidden]{display:none!important}
  .thumb{position:relative;flex:0 0 auto;width:60px;height:60px;border-radius:10px;overflow:hidden;
    border:1px solid var(--line-strong);background:rgba(255,255,255,.04)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .rm{position:absolute;top:2px;right:2px;width:18px;height:18px;border:none;border-radius:50%;
    cursor:pointer;background:rgba(0,0,0,.66);color:#fff;font-size:12px;line-height:1;display:grid;place-items:center}
  .thumb .rm:hover{background:#c5221f}
  /* 上传中:压暗 + 转圈,让"还没传完不能发"这件事可见 */
  .thumb.pending{opacity:.55}
  .thumb.pending::after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;
    border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  .thumb.failed{border-color:#c5221f}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.thumb.pending::after{animation:none}}
  /* 消息气泡里的图片 */
  .bubble-imgs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .bubble-imgs img{max-width:180px;max-height:180px;border-radius:10px;display:block;cursor:zoom-in}
  /* 确定取不到的图(换账号 404 / 文件丢了 410):给一个说明性占位。
     不 remove —— 图凭空消失比一个灰框难排查得多,用户只会以为自己记错了。 */
  .img-gone,.bubble-imgs img:not([src]){display:grid;place-items:center;flex:0 0 auto;
    width:120px;height:80px;border-radius:10px;box-sizing:border-box;
    border:1px dashed var(--line-strong);color:var(--muted);font-size:11.5px;
    background:rgba(255,255,255,.02);text-align:center;padding:0 6px;line-height:1.4;cursor:default}
  /* 还没取到的 <img>(首屏无令牌 / 暂时性失败待重试)同样渲染成占位框。
     不这么做的话它只有 alt 没有 src,浏览器会把「附件图片」当一行文字塞进气泡里。
     必须保持是 <img> 而不是换成 div:重试靠选择器 img[data-att],换了就选不中。 */
  /* 瞬时提示。用它而不是 alert():alert 阻塞交互且样式不可控;
     也不复用 setHealth —— 那是服务健康指示器,语义不同,借用会让"红点"含义变模糊。 */
  .toasts{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;
    display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toasts .t{max-width:min(92vw,420px);padding:9px 15px;border-radius:10px;font-size:13.5px;line-height:1.5;
    background:rgba(28,31,38,.97);color:var(--ink);border:1px solid var(--line-strong);
    box-shadow:var(--shadow);animation:toastIn .22s cubic-bezier(.16,1,.3,1) both}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.toasts .t{animation:none}}
  #send:hover{background:var(--accent-hover);transform:scale(1.04)}
  #send:active{transform:scale(0.92);filter:brightness(0.95);transition:transform 80ms ease-out}
  @media(prefers-reduced-motion:reduce){#send:active{transition:none}}
  .msg{animation:fadeUp .34s cubic-bezier(.16,1,.3,1) both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}
  @keyframes sideIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
  @keyframes topIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  @keyframes composerIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes welcomeIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:no-preference){
    #welcome h1,#welcome p,#welcome .chip{animation:welcomeIn .55s cubic-bezier(.16,1,.3,1) both}
    #welcome p{animation-delay:.08s}
    #welcome .chip:nth-child(1){animation-delay:.14s}
    #welcome .chip:nth-child(2){animation-delay:.2s}
    #welcome .chip:nth-child(3){animation-delay:.26s}
    #welcome .chip:nth-child(4){animation-delay:.32s}
    .brand-dot{animation:brandFloat 4.5s ease-in-out infinite}
    .thinking-dots i{animation:thinkingPulse 1.2s ease-in-out infinite}
    .thinking-dots i:nth-child(2){animation-delay:.15s}
    .thinking-dots i:nth-child(3){animation-delay:.3s}
    @keyframes brandFloat{50%{transform:translateY(-2px) rotate(-2deg)}}
    @keyframes thinkingPulse{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}}
  }
  @media(prefers-reduced-motion:reduce){
    .msg,.sidebar,.topbar,footer,#welcome h1,#welcome p,#welcome .chip,.brand-dot,.thinking-dots i{animation:none}
  }
  #welcome{transition:opacity .15s,transform .15s}
  .hint{text-align:center;color:var(--muted);font-size:11px;margin-top:9px}
  :where(button,.newchat,.item,.chip,.toggle,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .mask{display:none}
  @media(max-width:720px){
    .layout,.app{width:100vw;max-width:100vw}
    .app{flex:0 0 100vw}
    .sidebar{position:fixed;z-index:20;height:100%;box-shadow:2px 0 16px rgba(0,0,0,.12)}
    .sidebar.collapsed{margin-left:-280px}
    .mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.58);backdrop-filter:blur(3px);z-index:15}
    .mask.show{display:block}
    .topbar{padding:9px 12px}
    .top-link{display:none}
    .health{display:none}
    .wrap{padding:8px 16px 34px}
    #welcome{padding-top:44px}
    #welcome h1{font-size:34px}
    .chips{grid-template-columns:1fr}

</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="对话历史">
    <div class="side-head"><img class="brand-dot" src="/vendor/feather-white.png" alt="" aria-hidden="true"><span class="brand-copy"><span class="logo">Kinger Agent</span><span class="brand-sub">PERSONAL KNOWLEDGE SYSTEM</span></span></div>
    <button class="newchat" id="newChat" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>新对话<span class="shortcut">⌘ K</span></button>
    <div id="cloudBox">
      <div class="side-label">云端历史 · 本账号</div>
      <div class="cloud-hint">登录后跨设备可见(只读)</div>
      <div class="side-list" id="cloudList"></div>
    </div>
    <div class="side-label">本机最近</div>
    <div class="side-list" id="sideList"></div>
    <div class="side-foot">
      <button class="side-tool" id="exportChat" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>导出当前对话</button>
    </div>
  </aside>
  <div class="mask" id="mask"></div>

  <div class="app">
    <div class="topbar">
      <button class="hamb" id="hamb" title="菜单" aria-label="打开或收起菜单" aria-expanded="true" aria-controls="sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <span class="title">Agentic 博客问答</span>
      <div class="top-actions">
        <a class="top-link" href="/">首页</a>
        <a class="top-link" href="/blog/">知识库</a>
        <button class="top-link" id="authBtn" type="button" hidden></button>
        <div class="health" id="health" title="正在检查服务…"><span class="health-dot"></span></div>
      </div>
    </div>
    <main id="main"><div class="wrap" id="wrap"></div></main>
    <footer>
      <div class="composer">
        <div class="toggles">
          <button class="toggle" id="tDeep" type="button" title="RAG-Fusion 多查询，更全面但更慢" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4.5A3.5 3.5 0 0 0 6 8v.4A3.5 3.5 0 0 0 4 14.7 3.5 3.5 0 0 0 7.5 20H10V4.5zM14.5 4.5A3.5 3.5 0 0 1 18 8v.4a3.5 3.5 0 0 1 2 6.3A3.5 3.5 0 0 1 16.5 20H14V4.5zM10 9H7M14 12h4M10 15H7"/></svg><span>深度思考</span></button>
          <button class="toggle" id="tWeb" type="button" title="强制联网搜索（需服务器可联网）" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg><span>联网搜索</span></button>
          <button class="toggle" id="tLen" type="button" title="点击切换回答长度：标准 / 简短 / 详细" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 12h10M5 18h7"/></svg><span>回答长度：标准</span></button>
        </div>
        <!-- 待发送附件的缩略图条:有图才显示(hidden 由 JS 切) -->
        <div class="attachbar" id="attachBar" hidden aria-label="待发送的图片"></div>
        <div class="inputbar">
          <!-- accept 只是给文件选择器的提示,真正的类型判断在服务端按魔数做(改扩展名无效) -->
          <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
          <button class="attach-btn" id="attachBtn" type="button" title="添加图片" aria-label="添加图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-8.5 8.5a5 5 0 0 1-7.1-7.1l8.1-8.1a3.3 3.3 0 0 1 4.7 4.7l-8.1 8.1a1.7 1.7 0 0 1-2.4-2.4l7.5-7.4"/></svg></button>
          <textarea id="q" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button id="send" title="发送"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
        <div class="hint">回答由 AI 生成，可能有误；接地回答附来源可核验。</div>
      </div>
    </footer>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const wrap=$('#wrap'),main=$('#main'),qEl=$('#q'),sendBtn=$('#send'),sideList=$('#sideList'),sidebar=$('#sidebar'),mask=$('#mask');
const AGENT_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7h8M7 3v4M17 3v4M6 7h12a2 2 0 0 1 2 2v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V9a2 2 0 0 1 2-2Z"/><path d="M8 12h.01M16 12h.01M9 16h6"/></svg>';
const SOURCE_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M8 7h7"/></svg>';
const CHEVRON='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m7 9 5 5 5-5"/></svg>';
const WELCOME=`<div id="welcome"><div class="welcome-mark">${AGENT_ICON}<span>GROUNDED IN YOUR KNOWLEDGE BASE</span></div><h1>把博客变成可以对话的技术知识库</h1>
  <p>检索你的文章后再回答，并给出可核验引用。需要时也可以联网、写代码或生成 Mermaid 图。</p>
  <div class="chips"><button class="chip" type="button" data-q="NCCL 是什么？"><span class="chip-k">AI INFRA</span>NCCL 是什么？</button><button class="chip" type="button" data-q="CUDA out of memory 怎么排查？"><span class="chip-k">TROUBLESHOOTING</span>CUDA out of memory 怎么排查？</button>
  <button class="chip" type="button" data-q="用 Python 写一个快速排序"><span class="chip-k">CODE</span>用 Python 写一个快速排序</button><button class="chip" type="button" data-q="TCP 如何保证可靠传输？"><span class="chip-k">NETWORK</span>TCP 如何保证可靠传输？</button></div></div>`;

let deep=false,web=false,length='',busy=false,es=null,activeRun=null,deleteArmed='';
const LEN_CYCLE=['','short','detailed'],LEN_LABEL={'':'标准',short:'简短',detailed:'详细'};
// Tabler 风格细线图标(内联 SVG,零依赖;stroke=currentColor 便于随按钮状态变色)
const SV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">';
const IC={
  copy:SV+'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  up:SV+'<path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1z"/><path d="M7 11l4.5-8a2 2 0 0 1 2.6 2.5L13 9h5.5a2 2 0 0 1 2 2.5l-1.7 7A2 2 0 0 1 16.8 20H7"/></svg>',
  down:SV+'<path d="M17 13V4h3a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1z"/><path d="M17 13l-4.5 8a2 2 0 0 1-2.6-2.5L11 15H5.5a2 2 0 0 1-2-2.5l1.7-7A2 2 0 0 1 7.2 4H17"/></svg>',
  edit:SV+'<path d="M13.5 6.5 17.5 10.5M4 20l4.5-1 10-10a2.8 2.8 0 0 0-4-4l-10 10z"/></svg>',
  retry:SV+'<path d="M20 6v5h-5"/><path d="M18.5 15a7 7 0 1 1-1.6-7.4L20 11"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>',
};
let convs=JSON.parse(localStorage.getItem('convs')||'[]');
let cur=localStorage.getItem('cur')||'';

function nid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function saveC(){localStorage.setItem('convs',JSON.stringify(convs));localStorage.setItem('cur',cur);}
function curConv(){return convs.find(c=>c.id===cur);}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function escAttr(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function scroll(){main.scrollTop=main.scrollHeight;}
function narrow(){return window.innerWidth<=720;}
function cancelActive(){if(activeRun&&activeRun.cancel)activeRun.cancel();}

// 侧边栏开合
function syncSidebarA11y(){
  const open=!sidebar.classList.contains('collapsed');
  $('#hamb').setAttribute('aria-expanded',String(open));
  mask.classList.toggle('show',narrow()&&open);
}
function closeSidebar(){sidebar.classList.add('collapsed');syncSidebarA11y();}
$('#hamb').onclick=()=>{sidebar.classList.toggle('collapsed');syncSidebarA11y();};
mask.onclick=closeSidebar;
if(narrow())sidebar.classList.add('collapsed');
syncSidebarA11y();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&narrow()&&!sidebar.classList.contains('collapsed'))closeSidebar();});

// 会话管理
$('#newChat').onclick=()=>{
  if(busy)cancelActive();
  const c={id:nid(),title:'新对话',thread:nid(),msgs:[]};
  convs.unshift(c);cur=c.id;saveC();renderSide();renderChat();
  if(!narrow())qEl.focus({preventScroll:true});
  if(narrow())closeSidebar();
};
window.switchTo=id=>{if(busy)cancelActive();cur=id;saveC();renderSide();renderChat();
  if(narrow())closeSidebar();};
window.delConv=(id,e)=>{e.stopPropagation();
  if(deleteArmed!==id){deleteArmed=id;renderSide();setTimeout(()=>{if(deleteArmed===id){deleteArmed='';renderSide();}},2200);return;}
  if(busy&&cur===id)cancelActive();
  deleteArmed='';convs=convs.filter(c=>c.id!==id);
  if(cur===id)cur=convs[0]?convs[0].id:'';if(!convs.length)ensureConv();saveC();renderSide();renderChat();};
window.renameConv=(id,e)=>{e.stopPropagation();const c=convs.find(x=>x.id===id);if(!c)return;
  c.renaming=true;renderSide();setTimeout(()=>{const input=document.getElementById('rename_'+id);if(input){input.focus();input.select();}},0);};
window.commitRename=id=>{const c=convs.find(x=>x.id===id);const input=document.getElementById('rename_'+id);
  if(!c)return;c.title=((input&&input.value)||c.title||'新对话').trim().slice(0,40)||'新对话';delete c.renaming;saveC();renderSide();};
window.renameKey=(e,id)=>{if(e.key==='Enter'){e.preventDefault();commitRename(id);}
  else if(e.key==='Escape'){const c=convs.find(x=>x.id===id);if(c)delete c.renaming;renderSide();}};
function ensureConv(){if(!curConv()){const c={id:nid(),title:'新对话',thread:nid(),msgs:[]};convs.unshift(c);cur=c.id;saveC();}}
function renderSide(){
  sideList.innerHTML=convs.map(c=>c.renaming
    ?`<div class="item ${c.id===cur?'active':''}"><input class="rename-input" id="rename_${c.id}" value="${escAttr(c.title||'新对话')}" maxlength="40" onkeydown="renameKey(event,'${c.id}')" onblur="commitRename('${c.id}')"></div>`
    :`<div class="item ${c.id===cur?'active':''}" title="${escAttr(c.title)}"><button class="item-main" type="button" onclick="switchTo('${c.id}')">${esc(c.title||'新对话')}</button><span class="item-actions"><button class="item-action" type="button" title="重命名" onclick="renameConv('${c.id}',event)">${IC.edit}</button><button class="item-action ${deleteArmed===c.id?'armed':''}" type="button" title="${deleteArmed===c.id?'再次点击确认删除':'删除'}" onclick="delConv('${c.id}',event)">${IC.x}</button></span></div>`).join('');
}

$('#exportChat').onclick=()=>{
  const c=curConv();if(!c||!c.msgs.length)return;
  const body=['# '+(c.title||'Kinger Agent 对话'),''];
  c.msgs.forEach(m=>{body.push(m.role==='user'?'## 你':'## Kinger Agent','',m.content||'', '');
    if(m.sources&&m.sources.length)body.push('> 来源：'+m.sources.map(s=>s.doc_id||s.title||s.url||'').filter(Boolean).join('；'),'');});
  const blob=new Blob([body.join('\n')],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=(c.title||'kinger-agent').replace(/[\\/:*?"<>|]/g,'_')+'.md';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),0);
};

// 开关
$('#tDeep').onclick=e=>{deep=!deep;e.currentTarget.classList.toggle('on',deep);e.currentTarget.setAttribute('aria-pressed',deep);};
$('#tWeb').onclick=e=>{web=!web;e.currentTarget.classList.toggle('on',web);e.currentTarget.setAttribute('aria-pressed',web);};
$('#tLen').onclick=e=>{length=LEN_CYCLE[(LEN_CYCLE.indexOf(length)+1)%LEN_CYCLE.length];
  e.currentTarget.querySelector('span').textContent='回答长度：'+LEN_LABEL[length];
  e.currentTarget.classList.toggle('on',length!=='');e.currentTarget.setAttribute('aria-pressed',length!=='');};

// 轻量 markdown + 按需加载的自托管代码高亮
function normalizeLang(lang){
  const raw=(lang||'plain').toLowerCase(),aliases={py:'python',sh:'bash',shell:'bash',js:'javascript',ts:'typescript',
    yml:'yaml',cs:'csharp',md:'markdown',dockerfile:'docker',text:'plain',txt:'plain'};
  return (aliases[raw]||raw).replace(/[^a-z0-9_-]/g,'')||'plain';
}
function md(t){const B=[];
  t=t.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>{const i=B.length;
    const safeLang=normalizeLang(lang);
    B.push(`<div class="codeblock"><div class="bar"><span>${safeLang==='plain'?'code':safeLang}</span><button class="copy" onclick="copyCode(this)">${IC.copy}<span class="ct">复制</span></button></div><pre><code class="language-${safeLang}">${esc(code.replace(/\n$/,''))}</code></pre></div>`);
    return `@@CB${i}@@`;});
  t=esc(t);
  t=t.replace(/`([^`]+)`/g,'<code class="inline">$1</code>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,(m,txt,u)=>'<a href="'+u.replace(/"/g,'%22')+'" target="_blank" rel="noopener">'+txt+'</a>');
  t=t.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h2>$1</h2>');
  t=t.replace(/(?:^|\n)((?:[-*] .*(?:\n|$))+)/g,(m,it)=>'\n<ul>'+it.trim().split('\n').map(l=>'<li>'+l.replace(/^[-*] /,'')+'</li>').join('')+'</ul>');
  t=t.split(/\n{2,}/).map(p=>/^\s*<(h\d|ul|ol|div|pre)/.test(p)?p:('<p>'+p.replace(/\n/g,'<br>')+'</p>')).join('');
  t=t.replace(/@@CB(\d+)@@/g,(m,i)=>B[+i]);return t;}
window.copyCode=btn=>{const c=btn.closest('.codeblock').querySelector('code').textContent;
  navigator.clipboard.writeText(c).then(()=>{const s=btn.querySelector('.ct');if(s){s.textContent='已复制';setTimeout(()=>s.textContent='复制',1500);}});};

let _prismLoading=null;
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script load failed: '+src));document.head.appendChild(s);
  });
}
function loadPrism(){
  if(window.Prism&&window.Prism.highlightElement)return Promise.resolve(window.Prism);
  if(_prismLoading)return _prismLoading;
  _prismLoading=(async()=>{
    window.Prism={manual:true};
    await loadScript('/vendor/prism.js');
    for(const lang of ['python','bash','json','sql','java','go','csharp','typescript','yaml','docker','markdown']){
      await loadScript('/vendor/prism-'+lang+'.min.js');
    }
    return window.Prism;
  })();
  return _prismLoading;
}
function highlightCode(root){
  if(!root)return;
  const nodes=[...root.querySelectorAll('.codeblock code[class*="language-"]')]
    .filter(n=>!n.classList.contains('language-mermaid')&&!n.dataset.highlighted);
  if(!nodes.length)return;
  loadPrism().then(p=>nodes.forEach(n=>{p.highlightElement(n);n.dataset.highlighted='1';})).catch(()=>{});
}

const MODE={grounded:['接地 · 有引用','b-grounded'],web:['联网','b-web'],general:['通用知识','b-general'],refuse:['未作答','b-refuse']};
const STAGE_LABEL={
  route_question:'正在理解问题',contextualize_query:'正在结合对话上下文',retrieve:'正在检索知识库',
  grade_documents:'正在评估证据',transform_query:'正在优化检索方式',web_search:'正在搜索网络',
  grade_web:'正在核验网络来源',grounded_generate:'正在组织接地回答',web_generate:'正在整理联网资料',
  general_generate:'正在组织回答',refuse:'正在确认可回答范围',guardrails:'正在检查引用',
  record_turn:'正在保存对话上下文'
};
// 知识库来源 doc_id(如 "AIOps平台/项目描述.md")→ 博客文章 URL(生产同源 /blog/posts/...;
// 本地 :7860 因跨端口打不开,生产 venking.tech 下 nginx 同源可跳)。
function docUrl(doc){if(!doc)return'';return '/blog/posts/'+doc.replace(/\.md$/,'').split('/').map(encodeURIComponent).join('/')+'.html';}
function sourcesHtml(m){const md_=m.mode||'general',src=m.sources||[];let h='';
  if(md_==='grounded'&&src.length)h='<div class="t">来源（知识库）· 点击跳原文</div><ul>'+src.map(s=>{const u=docUrl(s.doc_id||'');const c=`<code class="inline">${esc(s.doc_id||'')}</code>`;return `<li>[${s.sid}] ${u?`<a href="${u}" target="_blank" rel="noopener">${c}</a>`:c}${s.section?' · '+esc(s.section):''}</li>`;}).join('')+'</ul>';
  else if(md_==='web'&&src.length)h='<div class="t">联网来源</div><ul>'+src.map(s=>`<li>[${s.wid}] <a href="${s.url}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a></li>`).join('')+'</ul>';
  else if(md_==='general'&&(m.suggestions||[]).length)h='<div class="t">你可能想问</div><ul>'+m.suggestions.map(s=>`<li>${esc(s)}</li>`).join('')+'</ul>';
  const label=md_==='web'?'查看联网出处':md_==='general'?'查看相关问题':'查看知识库引用';
  return h?`<details class="sources" open><summary>${SOURCE_ICON}<span>${label}</span>${CHEVRON}</summary><div class="sources-body">${h}</div></details>`:'';}

function errorHtml(message,cid,idx){
  return `<div class="error-card" role="alert"><strong>回答未完整生成</strong>${esc(message||'连接中断，请稍后重试。')}<button class="error-retry" type="button" onclick="retryAnswer('${cid}',${idx})">${IC.retry}<span>重新生成</span></button></div>`;
}
function answerHtml(m,c,idx){
  let html=md(m.content||'');
  // 正文里的 [S1]/[S2] 角标 → 可点链接,跳对应知识库文章原文(grounded 模式)
  if((m.mode||'')==='grounded'&&(m.sources||[]).length){
    const map={}; m.sources.forEach(s=>{if(s.sid!=null)map[String(s.sid)]=docUrl(s.doc_id||'');});
    html=html.replace(/\[S(\d+)\]/g,(mm,n)=>{const u=map[n];return u?`<a class="cite" href="${u}" target="_blank" rel="noopener" title="跳到来源原文">[S${n}]</a>`:mm;});
  }
  return html+(m.error?errorHtml(m.error,c.id,idx):'');
}

// 反馈闭环:每条最终回答下的 👍👎 → POST /api/feedback → feedback.jsonl(字段对齐 golden,人工补 id 即可进评测集)
function fbBar(c,idx,m){
  if(!m||m.role!=='bot'||!m.content||m.error) return ''; // 流式/失败回答不收集反馈
  if(m.correcting){                                    // 👎 展开:页面内嵌纠正框(不用浏览器原生 prompt)
    return `<div class="fbform"><textarea class="fbta" id="fbta_${idx}" placeholder="这个回答哪里不对？可写下正确答案/纠正（留空也可提交）"></textarea><div class="fbrow"><button class="fbsend" onclick="fbSubmit('${c.id}',${idx})">提交反馈</button><button class="fbcancel" onclick="fbCancel('${c.id}',${idx})">取消</button></div></div>`;
  }
  const up=m.fb==='up'?'on':'',down=m.fb==='down'?'on':'';
  return `<div class="actrow"><button class="actbtn" title="复制回答" onclick="copyAnswer(this,'${c.id}',${idx})">${IC.copy}</button><button class="actbtn ${up}" title="有帮助" onclick="fb('${c.id}',${idx},'up')">${IC.up}</button><button class="actbtn ${down}" title="需改进/纠正" onclick="fb('${c.id}',${idx},'down')">${IC.down}</button>${m.fb?'<span class="acttip">已记录，谢谢反馈</span>':''}</div>`;
}
window.copyAnswer=(btn,cid,idx)=>{
  const c=convs.find(x=>x.id===cid); if(!c) return; const m=c.msgs[idx]; if(!m) return;
  navigator.clipboard.writeText(m.content||'').then(()=>{const o=btn.innerHTML;btn.innerHTML=IC.check;btn.classList.add('on');setTimeout(()=>{btn.innerHTML=o;btn.classList.remove('on');},1400);});
};
function postFb(m,verdict,correction){                 // 统一提交:字段对齐 golden
  fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({verdict,question:m.q||'',answer:m.content||'',mode:m.mode||'general',
      retrieved_doc_ids:m.retrieved_doc_ids||[],sources:m.sources||[],correction})}).catch(()=>{});
}
window.fb=(cid,idx,verdict)=>{
  const c=convs.find(x=>x.id===cid); if(!c) return;
  const m=c.msgs[idx]; if(!m||m.role!=='bot'||m.fb) return;   // 已反馈过不重复
  if(verdict==='up'){ m.fb='up'; saveC(); renderChat(); postFb(m,'up',''); return; }
  m.correcting=true; saveC(); renderChat();                   // 👎 → 就地展开纠正框
  setTimeout(()=>{const t=document.getElementById('fbta_'+idx); if(t) t.focus();},0);
};
window.fbSubmit=(cid,idx)=>{
  const c=convs.find(x=>x.id===cid); if(!c) return; const m=c.msgs[idx]; if(!m) return;
  const t=document.getElementById('fbta_'+idx); const correction=t?t.value.trim():'';
  m.correcting=false; m.fb='down'; saveC(); renderChat(); postFb(m,'down',correction);
};
window.fbCancel=(cid,idx)=>{const c=convs.find(x=>x.id===cid); if(!c) return; const m=c.msgs[idx]; if(m) m.correcting=false; saveC(); renderChat();};
window.retryAnswer=(cid,idx)=>{
  if(busy)return;
  const c=convs.find(x=>x.id===cid),m=c&&c.msgs[idx],u=c&&c.msgs[idx-1];
  if(!c||idx!==c.msgs.length-1||!m||!m.error||!u||u.role!=='user')return;
  const q=u.content;c.msgs.splice(idx-1,2);cur=cid;saveC();renderSide();renderChat();runQuery(q);
};

// ===== Mermaid 渲染(A 方案:自托管 /vendor/mermaid.min.js,同源,懒加载一次)=====
// 为什么懒加载:mermaid 库 ~3.4MB,只在某条回答真含流程图时才加载,纯问答用户零负担。
let _mmLoading=null;
function loadMermaid(){
  if(window.mermaid) return Promise.resolve(window.mermaid);
  if(_mmLoading) return _mmLoading;
  _mmLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='/vendor/mermaid.min.js';
    s.onload=()=>{try{window.mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'dark',fontFamily:'inherit'});}catch(e){}res(window.mermaid);};
    s.onerror=()=>rej(new Error('mermaid load failed'));
    document.head.appendChild(s);
  });
  return _mmLoading;
}
// LLM 生成的 mermaid 常见小毛病 → 轻量自动修复(失败也不崩,兜底保留代码块)
function repairMermaid(code){
  return code
    .replace(/[，]/g,',').replace(/[；]/g,';').replace(/[：]/g,':')   // 全角标点→半角
    .replace(/[（]/g,'(').replace(/[）]/g,')')
    .replace(/^\s*```(mermaid)?\s*/i,'').replace(/```\s*$/,'')          // 误带的围栏
    .trim();
}
let _mmId=0;
async function renderMermaid(root){
  if(!root) return;
  // 找出 lang 为 mermaid、且尚未处理的代码块
  const blocks=[...root.querySelectorAll('.codeblock')].filter(cb=>{
    const l=cb.querySelector('.bar span'); return l&&/^mermaid$/i.test(l.textContent.trim())&&!cb.dataset.mmDone;});
  if(!blocks.length) return;
  // 先就地放"渲染中"占位:首次要下 3.4MB 绘图库,别让用户干看代码
  const jobs=blocks.map(cb=>{
    cb.dataset.mmDone='1';
    const raw=cb.querySelector('code').textContent;
    const ph=document.createElement('div'); ph.className='mermaid-loading';
    ph.textContent=window.mermaid?'流程图渲染中…':'流程图渲染中…（首次需加载绘图库，稍候）';
    cb.replaceWith(ph); return {ph,raw};
  });
  let mm; try{mm=await loadMermaid();}catch(e){ jobs.forEach(j=>j.ph.textContent='（绘图库加载失败，无法渲染流程图）'); return; }
  for(const j of jobs){
    const id='mm'+(++_mmId);
    try{ const {svg}=await mm.render(id, j.raw); swapSvg(j.ph,svg); }
    catch(e){
      try{ const {svg}=await mm.render(id+'r', repairMermaid(j.raw)); swapSvg(j.ph,svg); }   // 自动修复重试一次
      catch(e2){ j.ph.className='codeblock'; j.ph.innerHTML='<pre><code>'+esc(j.raw)+'</code></pre>'; }  // 兜底:显示源码,不空白
    }
  }
}
function swapSvg(ph,svg){const w=document.createElement('div');w.className='mermaid-wrap';w.innerHTML=svg;ph.replaceWith(w);}

function renderChat(){
  const c=curConv();
  if(!c||!c.msgs.length){wrap.innerHTML=WELCOME;document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{qEl.value=ch.dataset.q||'';send();});return;}
  wrap.innerHTML=c.msgs.map((m,idx)=>m.role==='user'
    ?`<div class="msg user"><div class="bubble">${attImgsHtml(m.atts)}${esc(m.content)}</div></div>`
    :`<div class="msg bot"><div class="role"><span class="avatar">${AGENT_ICON}</span>Kinger Agent</div><div class="content">${(m.mode?`<span class="badge ${(MODE[m.mode]||MODE.general)[1]}">${(MODE[m.mode]||MODE.general)[0]}</span>`:'')+answerHtml(m,c,idx)+sourcesHtml(m)+fbBar(c,idx,m)}</div></div>`).join('');
  renderMermaid(wrap);                        // 历史消息重渲染时也把 mermaid 画成图
  highlightCode(wrap);
  void hydrateAttImgs(wrap);                  // 附件占位 → 带鉴权取回后填 blob
  scroll();
}

qEl.addEventListener('input',()=>{qEl.style.height='auto';qEl.style.height=Math.min(qEl.scrollHeight,180)+'px';});
qEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
sendBtn.onclick=()=>{if(busy)cancelActive();else send();};
function stopUI(){busy=false;es=null;activeRun=null;sendBtn.classList.remove('stop');sendBtn.innerHTML=IC.send;}
function send(){const q=qEl.value.trim();if(!q||busy)return;qEl.value='';qEl.style.height='auto';runQuery(q);}

function runQuery(q){
  ensureConv();const c=curConv();
  if(c.msgs.length===0){c.title=q.slice(0,22);renderSide();}
  {const w=$('#welcome');if(w){w.style.opacity='0';w.style.transform='translateY(-8px)';setTimeout(()=>w.remove(),160);}}
  // 附件:发送这一刻**快照**已上传成功的那些,然后清空待发区。
  // 快照而不是引用 pend:发送是异步的,期间用户可能又加/删图,直接读 pend 会串。
  // 仍在上传中的**留在 pend 里**继续传完 —— 踢出去的话它的 fetch 还在飞,
  // 成功后会写进一个已脱离 UI 的对象:DB 行和 blob 都建了,却看不到、发不出、删不掉,
  // 每次「图还在转圈就按回车」都漏一份配额。
  const sentAtt=pend.filter(p=>p.state==='ok'&&p.id);
  const stillUp=pend.filter(p=>p.state==='up');
  if(stillUp.length)toast(`${stillUp.length} 张还在上传,已先发送其余内容`);
  pend.filter(p=>p.state==='err').forEach(p=>URL.revokeObjectURL(p.url));
  // 本地预览的 blob 直接**复用**成该 id 的缓存:省一次带鉴权取回,也不白留一个 blob。
  sentAtt.forEach(p=>attBlobs.set(p.id,p.url));
  pend=stillUp;renderAttach();

  c.msgs.push({role:'user',content:q,atts:sentAtt.map(a=>a.id)});
  c.msgs.push({role:'bot',content:''});
  const bi=c.msgs.length-1;saveC();
  wrap.insertAdjacentHTML('beforeend',`<div class="msg user"><div class="bubble">${attImgsHtml(sentAtt.map(a=>a.id))}${esc(q)}</div></div>`);
  void hydrateAttImgs(wrap);   // 否则刚发出的这条只显示 alt 文字,要切走会话再切回来才出现
  wrap.insertAdjacentHTML('beforeend',`<div class="msg bot"><div class="role"><span class="avatar">${AGENT_ICON}</span>Kinger Agent</div><div class="content" aria-live="polite"><span class="thinking"><span class="thinking-icon">${AGENT_ICON}</span><span>正在准备回答</span><span class="thinking-dots" aria-hidden="true"><i></i><i></i><i></i></span></span></div></div>`);
  scroll();
  const content=wrap.lastElementChild.querySelector('.content');
  busy=true;sendBtn.classList.add('stop');sendBtn.innerHTML=IC.stop;
  let acc='',done=null,errorMessage='',finished=false;
  const tok=window.__accessToken?`&access_token=${encodeURIComponent(window.__accessToken)}`:'';  // 登录用户:后端按 sub 落库历史
  // 只带**已上传成功**的 id;正在上传/失败的不发(服务端也会再校验一遍所有权)
  const attParam=sentAtt.length?`&att=${encodeURIComponent(sentAtt.map(a=>a.id).join(','))}`:'';
  const url=`/api/chat?q=${encodeURIComponent(q)}&thread=${encodeURIComponent(c.thread)}&deep=${deep}&web=${web}&length=${length}${tok}${attParam}`;
  const source=new EventSource(url);es=source;
  activeRun={cancel:()=>{errorMessage='已停止生成，可重新发送此问题。';finish();}};
  source.onmessage=e=>{let ev;try{ev=JSON.parse(e.data);}catch{return;}
    if(ev.type==='token'){acc+=ev.text;content.innerHTML=md(acc)+'<span class="cursor"></span>';scroll();}
    else if(ev.type==='progress'&&ev.status==='start'&&!acc){
      const label=STAGE_LABEL[ev.stage]||'正在准备回答',text=content.querySelector('.thinking span:nth-child(2)');
      if(text)text.textContent=label;
    }
    else if(ev.type==='error'){errorMessage=ev.msg||'服务暂时不可用，请稍后重试。';setHealth(false,'对话失败——Agent 生成出错(见服务端日志,多为 LLM 端点/密钥问题)');finish();}
    else if(ev.type==='done'){done=ev;setHealth(true,'服务正常');finish();}};
  source.onerror=()=>{if(!finished){errorMessage='连接中断，请检查网络后重试。';setHealth(false,'连接中断');finish();}};
  function finish(){
    if(finished)return;finished=true;source.close();
    const m=c.msgs[bi];
    m.content=(done&&done.answer)?done.answer:acc;
    m.error=errorMessage;
    m.q=q;                                   // 记住这条回答对应的问题(反馈回传要用)
    if(done){m.mode=done.mode;m.sources=done.sources||[];m.suggestions=done.suggestions||[];m.retrieved_doc_ids=done.retrieved_doc_ids||[];
      m.request_id=done.request_id||'';m.trace=done.trace||[];m.latency_ms=done.latency_ms||0;}
    saveC();
    content.innerHTML=(m.mode?`<span class="badge ${(MODE[m.mode]||MODE.general)[1]}">${(MODE[m.mode]||MODE.general)[0]}</span>`:'')+answerHtml(m,c,bi)+sourcesHtml(m)+fbBar(c,bi,m);
    renderMermaid(content);                   // 回答完成:把 ```mermaid 代码块渲成流程图
    highlightCode(content);
    stopUI();scroll();qEl.focus();
  }
}

// 真健康检查：顶部状态来自后端，不显示静态假状态。
// 服务状态小圆点:启动先用 /ready(校验 key+知识库),之后每次对话的真实结果会覆盖它
// (见 runQuery 里 setHealth 调用)——所以生成失败时会真的变红,不再"绿灯却答不了"。
function setHealth(ok,msg){const h=$('#health');if(!h)return;h.classList.toggle('ok',ok);h.classList.toggle('fail',!ok);if(msg)h.title=msg;}
fetch('./ready',{cache:'no-store'}).then(r=>setHealth(r.ok,r.ok?'服务正常':'服务不可用(缺 API key / 知识库)'))
  .catch(()=>setHealth(false,'服务不可用'));

// 桌面快捷键只负责新建会话，不侵占输入框内的常规按键。
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#newChat').click();}});

ensureConv();renderSide();renderChat();
if(!narrow())qEl.focus({preventScroll:true});

// ===== 图片附件(Gemini 风:回形针 + 输入框上方缩略图条)=====
// 流程:选图 → 立刻上传拿 id → 缩略图转为就绪 → 发送时只把 id 串进 ?att=。
// 为什么先上传:SSE 那条是 GET(EventSource 限制),传不了文件;分开还让同一张图能被多轮追问复用。
// 附件仅登录可用 —— 匿名不落库,存了就无主、算不了配额也回收不掉。
// 轻量 toast:2.6s 自动消失。aria-live 让读屏软件也能播报(不然视障用户完全收不到反馈)。
function toast(msg){
  let box=$('.toasts');
  if(!box){box=document.createElement('div');box.className='toasts';
    box.setAttribute('aria-live','polite');document.body.appendChild(box);}
  const el=document.createElement('div');el.className='t';el.textContent=msg;
  box.appendChild(el);
  setTimeout(()=>{el.remove();if(!box.children.length)box.remove();},2600);
}

const attachBar=$('#attachBar'),attachBtn=$('#attachBtn'),fileInput=$('#fileInput');
let pend=[];          // [{key, id|null, url(本地预览), state:'up'|'ok'|'err', name, deduped}]
let authedNow=false;  // 由 kinger-auth 事件同步

// 配额信息(used/quota/max_file)。单文件上限**从服务端取**而不是前端写死 5MB ——
// 写死就是同一个数字存在两处,改了 UPLOAD_MAX_BYTES 之后前端还按旧值放行,
// 用户白传一遍才收到 413。取不到时才回落常量。
let quotaInfo=null;
const FALLBACK_MAX=5*1024*1024;
const mb=n=>(n/1048576).toFixed(n>=10*1048576?0:1);
async function refreshQuota(){
  if(!authedNow||!window.__accessToken)return null;
  try{
    const r=await fetch('/api/me/attachments/quota',
      {headers:{Authorization:'Bearer '+window.__accessToken}});
    if(r.ok)quotaInfo=await r.json();
  }catch{}
  // 只更新那一行文字,**不重建整个 attachBar**:innerHTML 重建会让上传中的转圈动画
  // 跳回 0°,还会把所有预览 <img src="blob:"> 重新解码(8 张 5MB × 8 次成功回调,
  // 手机上是实打实的卡顿)。
  const note=$('.attach-note');
  if(note)note.textContent=attachNote();
  return quotaInfo;
}

function attachNote(){
  // 诚实提示:图片目前只保存进历史,**不参与回答**(VL 还没接)。
  // 不说的话用户会以为模型看了图并采信答案 —— 那比不支持更糟。
  // 顺带把已用配额显示出来:超限文案让人"删旧附件",不给用量他无从判断。
  const q=quotaInfo?` · 已用 ${mb(quotaInfo.used_bytes)}/${mb(quotaInfo.quota_bytes)}MB`:'';
  return `图片会保存在对话记录里,但暂不参与 AI 回答${q}`;
}
function renderAttach(){
  attachBar.hidden=pend.length===0;
  const note=pend.length?`<div class="attach-note">${esc(attachNote())}</div>`:'';
  attachBar.innerHTML=note+'<div class="row">'+pend.map(p=>{
    const cls=p.state==='up'?' pending':(p.state==='err'?' failed':'');
    const tip=p.state==='err'?'上传失败,点 ✕ 移除后重试':esc(p.name||'图片');
    return `<div class="thumb${cls}" title="${escAttr(tip)}"><img src="${escAttr(p.url)}" alt=""><button class="rm" type="button" data-k="${escAttr(p.key)}" aria-label="移除">✕</button></div>`;
  }).join('')+'</div>';
}
attachBar.addEventListener('click',e=>{
  const b=e.target.closest('.rm');if(!b)return;
  const p=pend.find(x=>x.key===b.dataset.k);
  if(p){
    URL.revokeObjectURL(p.url);                     // 释放 blob,否则一直占内存
    // 移除待发图时**同时删服务端记录**。少了这一步配额就只增不减:上传成功后点 ✕,
    // 库里的行和 blob 都留着继续吃 100MB,而 UI 里再没有任何入口能删它 ——
    // 超限时那句"请先删除一些旧附件"就成了一个做不到的动作,用户零自救路径。
    // ⚠️ 只删 deduped===false 的:命中去重时返回的是**本人此前上传过**的旧 id,
    // 很可能已被历史消息引用,删掉会把过去那条消息的图一起打掉(静默数据丢失)。
    if(p.state==='ok'&&p.id&&!p.deduped)void deleteAtt(p.id);
  }
  pend=pend.filter(x=>x.key!==b.dataset.k);renderAttach();
});
async function deleteAtt(id){
  if(!window.__accessToken)return;     // 没令牌就别白跑一趟发出字面量 `Bearer undefined`
  try{
    const r=await fetch(`/api/me/attachments/${encodeURIComponent(id)}`,
      {method:'DELETE',headers:{Authorization:'Bearer '+window.__accessToken}});
    // 缩略图已经无条件移除了,所以删失败必须说出来:否则配额没释放、用户不知道,
    // 而 UI 里没有附件管理页,他没有任何重试入口。
    if(!r.ok)toast('删除失败,这张图仍占用配额');
  }catch{toast('删除失败,这张图仍占用配额');}
  void refreshQuota();
}
attachBtn.onclick=()=>{
  if(!authedNow){toast('登录后才能发图片');return;}   // 不静默失败:说清为什么
  fileInput.click();
};
fileInput.onchange=()=>{addFiles(fileInput.files);fileInput.value='';};  // 清空 value,同一文件可再选

async function addFiles(files){
  if(!authedNow){toast('登录后才能发图片');return;}
  // **同步取上限,不 await。** await 一整个 /quota 往返才建第一个缩略图的话,
  // 慢网或后端冷启动时用户选完图界面什么都不发生、超时更是整批卡死且零反馈。
  // 回落值就是服务端的默认值,拿错的代价只是少拦一次 —— 而后端 413 + 状态码映射
  // 已经能给出准话。顺便预热,给下一批用。
  const lim=(quotaInfo&&quotaInfo.max_file_bytes)||FALLBACK_MAX;
  void refreshQuota();
  for(const f of Array.from(files||[])){
    if(!f.type.startsWith('image/')){toast(`「${f.name}」不是图片`);continue;}
    // **本地先拦体积。** 不拦的话手机原图(8~12MB 很常见)会白传一遍,而且根本到不了应用:
    // nginx 的 client_max_body_size 6m 先返回它**自己的英文 413 HTML**(没有 detail 字段),
    // 前端解析不出 detail 就只能说"上传失败";更糟的是 nginx 拒绝时 lingering close,
    // 部分浏览器直接报成网络错误 → toast 出"请检查网络",把"图太大"说成网络问题。
    // 移动网络下白传 10MB 也是实打实的代价。
    if(f.size>lim){toast(`「${f.name}」${mb(f.size)}MB,超过 ${mb(lim)}MB 上限`);continue;}
    if(pend.length>=8){toast('一次最多 8 张');break;}
    const item={key:Math.random().toString(36).slice(2),id:null,url:URL.createObjectURL(f),state:'up',name:f.name,deduped:false};
    pend.push(item);renderAttach();
    try{
      const fd=new FormData();fd.append('file',f);
      const headers={};
      if(window.__accessToken)headers['Authorization']='Bearer '+window.__accessToken;
      const r=await fetch('/api/me/attachments',{method:'POST',body:fd,headers});
      if(!r.ok){
        // 先按状态码给准话,再让服务端的 detail 覆盖它。反过来写(默认"上传失败" + 尝试
        // 读 detail)在**非 JSON 响应**上就退化成一句无信息的"上传失败" ——
        // 而 nginx 的 413 恰恰是 HTML。
        let msg=({413:'文件太大,超过上限',415:'只支持 jpeg/png/gif/webp 图片',
                  401:'登录已过期,请重新登录',429:'操作太频繁,请稍后再试',
                  507:'站点存储已满,暂时无法上传'})[r.status]||`上传失败(${r.status})`;
        try{const j=await r.json();if(j&&j.detail)msg=j.detail;}catch{}
        item.state='err';renderAttach();toast(msg);continue;   // 服务端的 413/415 文案优先给用户看
      }
      const j=await r.json();
      // **同一张图在一次 compose 里被选两次**:第二次会命中服务端去重,返回**同一个 id**。
      // 不查重会出两个独立且都糟的后果:
      //   ① 点掉其中 deduped===false 那个 → DELETE 真删 → 另一个 thumb 仍照常发出,
      //      被服务端的 owner 校验静默过滤;而预览 blob 已按这个 id 缓存进 attBlobs,
      //      所以**发出去当时看起来完全正常**,刷新后才变「图片已不可用」——
      //      "发出去了、当时能看见、过一会儿没了"是最难自证的一类 bug。
      //   ② 就算不点 ✕,两个都发 → att=<id>,<id> → parts 里两条一样的 image_url
      //      → 气泡里同一张图渲染两遍,而且**云端历史里永久如此**。
      // 所以在这里按 id 查重,而不是去动 deduped 标记(后者只堵①不堵②)。
      if(pend.some(x=>x!==item&&x.id===j.id)){
        URL.revokeObjectURL(item.url);
        pend=pend.filter(x=>x!==item);
        renderAttach();toast('这张图已在待发区');continue;
      }
      item.id=j.id;item.deduped=Boolean(j.deduped);item.state='ok';
      renderAttach();void refreshQuota();
    }catch{item.state='err';renderAttach();toast('上传失败,请检查网络');}
  }
}
// 渲染消息里的附件图片。
// 先输出**占位** <img data-att=id>,再异步用 fetch 带 Authorization 换 blob 塞回去 ——
// 因为 <img src> 发不了请求头,而取回端点是要鉴权的(附件属于私人对话,不能放公开目录)。
// 不走 `?access_token=` 那条路:那会把令牌写进 DOM 属性,而这里完全可以避开。
function attImgsHtml(ids){
  if(!ids||!ids.length)return '';
  return `<div class="bubble-imgs">${ids.map(id=>`<img data-att="${escAttr(id)}" alt="图片加载中…">`).join('')}</div>`;
}
// attBlobs: id → blobURL **或**正在取的 Promise<blobURL>。
// 存 in-flight promise 而不只存结果:data-done 只在**当前**元素上、fetch 前打,后面 N−1 个
// 元素在第一次 await 期间还没标记 —— 8 张图的下载时间里任何 renderChat(切会话)或 runQuery
// 都会启动第二趟 hydrate,同一 id 就被下两次,两个 createObjectURL 里前一个**永久泄漏**。
// 按 id 缓存 promise,全局每个 id 只下一次。
const attBlobs=new Map();
async function hydrateAttImgs(root){
  const els=[...(root||document).querySelectorAll('img[data-att]:not([data-done])')];
  if(!els.length)return;
  // **没令牌就原样留着,不 fetch、不打 data-done**,等 kinger-auth 到了会再调一次。
  // 曾经在这里直接 fetch,结果是刷新页面后历史里的图全部凭空消失:
  // 这段是内联经典脚本、解析期同步跑完(renderChat 在文件末尾就调了),
  // 而 /vendor/auth.js 是 type="module"(defer)且取令牌本身还是异步的 ——
  // 所以首屏 hydrate 时 __accessToken **必然**是 undefined → 不带 Authorization → 401
  // → 旧代码 el.remove() 把占位删掉,catch 又吞了错误,控制台干净得像没事发生。
  // 而 data-done 是在 fetch **之前**打的,所以再调 hydrate 也不会重试 —— 静默且不可恢复。
  if(!window.__accessToken)return;
  for(const el of els){
    // 上一次 await 期间 renderChat() 可能已经换掉 wrap.innerHTML,手里这批就成了
    // 脱离文档的节点 —— 继续下完只是把几 MB 赋给看不见的元素,移动网络下是白烧流量。
    // 用 continue 而非 return:今天 renderChat 是整块替换,所以"一个脱离 ⇒ 整批脱离",
    // 但那是**隐式前提**(finish() 就已经在就地局部重渲染 bot 那半边了)。哪天加
    // "编辑这条提问"去就地重渲染 user 气泡,前提一破,return 会让其余图静默不加载、
    // 无报错、也不重试(连 data-done 都没打上,只有下次整体重渲染才被捡起)。
    // continue 的成本只是最多 8 次 isConnected 判断 —— 零 fetch、零副作用。
    if(!el.isConnected)continue;
    el.dataset.done='1';
    const id=el.dataset.att;
    try{
      if(!attBlobs.has(id))attBlobs.set(id,fetchAtt(id));
      const u=await attBlobs.get(id);
      if(el.isConnected)el.src=u;
    }catch(e){
      // 404(不属于本账号)/410(记录在、文件没了)是**确定**取不到 → 换成永久的"没了"占位。
      // 其余(401 令牌刚过期、429、5xx)可能只是暂时的 → **保持这个 <img> 不动**,
      // 只清 data-done,下次 hydrate(令牌到手/切会话)会重试。
      // 关键:不能把暂时性失败也 replaceWith 成 div —— 选择器是 img[data-att],
      // 换成 div 就再也选不中,等于亲手掐断刚做好的重试路径。
      // 无 src 的 <img> 由 CSS(.bubble-imgs img:not([src]))渲染成虚线占位框,
      // 不会把 alt 文本裸露成气泡里的一行字。
      attBlobs.delete(id);                          // 失败的 promise 不留在缓存里
      if(!el.isConnected)continue;
      if(e&&e.gone)el.replaceWith(imgBox('img-gone','图片已不可用'));
      else delete el.dataset.done;
    }
  }
}
async function fetchAtt(id){
  const r=await fetch(`/api/me/attachments/${encodeURIComponent(id)}`,
    {headers:{Authorization:'Bearer '+window.__accessToken}});
  if(!r.ok){
    const e=new Error(String(r.status));
    e.gone=(r.status===404||r.status===410);        // 确定取不到,区别于暂时性失败
    throw e;
  }
  return URL.createObjectURL(await r.blob());
}
function imgBox(cls,text){
  const d=document.createElement('div');
  d.className=cls;d.textContent=text;
  return d;
}
// 粘贴与拖拽:和按钮同一条路径,不额外实现一套
document.addEventListener('paste',e=>{
  const imgs=Array.from(e.clipboardData?.items||[]).filter(i=>i.type.startsWith('image/'));
  if(!imgs.length)return;
  e.preventDefault();addFiles(imgs.map(i=>i.getAsFile()).filter(Boolean));
});
['dragover','drop'].forEach(t=>document.addEventListener(t,e=>{
  if(!Array.from(e.dataTransfer?.types||[]).includes('Files'))return;
  e.preventDefault();
  if(t==='drop')addFiles(e.dataTransfer.files);
}));

// ===== Logto 终端用户登录 + 云端历史(与匿名流程解耦;由 /vendor/auth.js 模块驱动) =====
const authBtn=$('#authBtn'),cloudBox=$('#cloudBox'),cloudList=$('#cloudList');
function fmtTime(ts){if(!ts)return'';try{return new Date(ts).toLocaleDateString('zh-CN');}catch{return'';}}
window.addEventListener('kinger-auth',ev=>{
  const d=ev.detail||{};
  // 附件仅登录可用:未登录就把回形针置灰并说明原因,而不是让人点了才收到错误。
  // 登出时清掉待发区 —— 那些 id 已不属于当前会话,发出去只会被服务端过滤。
  authedNow=Boolean(d.authed);
  attachBtn.disabled=!authedNow;
  attachBtn.title=authedNow?'添加图片':'登录后可发送图片';
  if(!authedNow&&pend.length){pend.forEach(p=>URL.revokeObjectURL(p.url));pend=[];renderAttach();}
  // 登出/换账号:把已取回的图 blob 全部释放、清缓存,并把 DOM 里的 <img> 退回占位。
  // ① 与取回端点选 `Cache-Control: no-store` 想挡的是**同一类**威胁(同标签换账号后
  //    看到上一账号的图)。今天不可达只是因为 logout 是整页导航、页面随之销毁 ——
  //    那是巧合而非设计。所以这里连 DOM 一起复位:光清 map 是不够的,`blob:` URL 一旦
  //    赋进 src,撤销之后图**仍然显示在屏幕上**(已解码的位图不会因 revoke 消失)。
  // ② attBlobs 从不 revoke,而发送时还把**原图预览** blob(可达 5MB/张)长期挂进去,
  //    一次会话看几十张图就是几百 MB 常驻。
  // 注意用 Promise.resolve 统一处理:map 里存的可能是 string(本地预览)也可能是
  //    **已 resolve 的 Promise**(经 fetchAtt 取回的,成功后没换回字符串)——
  //    只判 `typeof v==='string'` 会漏掉后者,也就是漏掉**全部**从服务端取回的图。
  if(!authedNow){
    attBlobs.forEach(v=>{Promise.resolve(v).then(u=>URL.revokeObjectURL(u),()=>{});});
    attBlobs.clear();quotaInfo=null;
    wrap.querySelectorAll('img[data-att]').forEach(el=>{
      el.removeAttribute('src');delete el.dataset.done;   // 退回 :not([src]) 占位,可重新 hydrate
    });
  }
  if(!d.configured){authBtn.hidden=true;cloudBox.classList.remove('show');return;}
  authBtn.hidden=false;
  if(d.authed){
    const name=(d.user&&(d.user.username||d.user.name||d.user.email))||'我的账号';
    authBtn.textContent=name;authBtn.title='点击退出登录';
    authBtn.onclick=()=>{if(confirm('退出登录?'))window.KingerAuth.logout();};
    cloudBox.classList.add('show');renderCloud();
    // 令牌到手才补一次 hydrate:首屏 renderChat() 跑在这之前,那时没令牌,
    // 历史消息里的图只是**留着占位**(见 hydrateAttImgs)。没有这一行,
    // 刷新页面后图要等切走会话再切回来才出现。
    void hydrateAttImgs(wrap);
    void refreshQuota();
  }else{
    authBtn.textContent='登录';authBtn.title='登录以跨设备同步历史';
    authBtn.onclick=()=>window.KingerAuth.login();
    cloudBox.classList.remove('show');cloudList.innerHTML='';
  }
});
async function renderCloud(){
  try{
    const {items=[]}=await window.KingerAuth.listConversations();
    if(!items.length){cloudList.innerHTML='<div class="cloud-hint">暂无云端对话</div>';return;}
    cloudList.innerHTML=items.map(it=>`<div class="item" title="${escAttr(it.title||'对话')}"><button class="item-main" type="button" onclick="openCloud('${it.id}')">${esc(it.title||'未命名对话')}</button><span class="item-actions"><span class="cloud-hint" style="padding:0 6px">${fmtTime(it.updated_at)}</span></span></div>`).join('');
  }catch{cloudList.innerHTML='<div class="cloud-hint">历史加载失败</div>';}
}
window.openCloud=async id=>{
  try{
    const conv=await window.KingerAuth.getConversation(id);
    // 映射服务端消息(assistant→bot)到本地渲染模型;标记只读,不写 localStorage。
    const msgs=(conv.messages||[]).map(m=>({role:m.role==='assistant'?'bot':'user',content:m.content||'',
      mode:m.mode,sources:m.sources||[],q:m.role==='assistant'?null:m.content,
      // 服务端的 parts 是标准 OpenAI 结构,图片 url 形如 `attachment:<id>`(见 models.Message)。
      // 老消息 parts 为 null → atts 为空,按纯文本渲染,两条路径都要能走。
      atts:(m.parts||[]).filter(p=>p&&p.type==='image_url')
        .map(p=>String(p.image_url&&p.image_url.url||'').replace(/^attachment:/,''))
        .filter(Boolean)}));
    const c={id:'cloud_'+id,title:(conv.title||'云端对话')+' · 只读',thread:conv.thread_id||nid(),msgs,readonly:true};
    convs=convs.filter(x=>!String(x.id).startsWith('cloud_'));  // 只保留一个临时只读会话
    convs.unshift(c);cur=c.id;renderSide();renderChat();
    if(narrow())closeSidebar();
  }catch{alert('无法加载该对话');}
};
</script>
<script type="module" src="/vendor/auth.js"></script>
